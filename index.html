<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<title>Kanatlı Tarlalar</title>
<style>
  :root{--ui:#fff8ec;--ink:#3b2a1a;--accent:#e8913a;--green:#4c9a3f;--line:#c9a875}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#2f6b3a;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .hud{position:fixed;z-index:5;display:flex;gap:8px;align-items:center}
  .pill{background:var(--ui);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-weight:700;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .btn{background:var(--ui);border:3px solid var(--ink);border-radius:14px;min-width:46px;height:46px;font-size:20px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer;padding:0 10px;font-family:inherit}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.5}
  #topL{top:calc(10px + env(safe-area-inset-top));left:10px}
  #topR{top:calc(10px + env(safe-area-inset-top));right:10px}
  #hotbar{bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ui);border:3px solid var(--ink);border-radius:16px;padding:5px;gap:5px;box-shadow:0 3px 0 rgba(0,0,0,.35);max-width:calc(100vw - 20px);overflow-x:auto}
  .slot{width:48px;height:48px;border-radius:10px;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;line-height:1;position:relative;cursor:pointer;flex:0 0 auto;background:#fff}
  .slot small{font-size:12px;font-weight:700;margin-top:2px}
  .slot.sel{border-color:var(--accent);background:#ffe7c9;box-shadow:inset 0 0 0 2px var(--accent)}
  .slot.empty{opacity:.45}
  #action{position:fixed;z-index:6;left:16px;bottom:calc(84px + env(safe-area-inset-bottom));min-width:96px;height:64px;border-radius:20px;font-size:17px;display:none}
  #toast{position:fixed;z-index:20;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(40,25,10,.88);color:#fff;padding:8px 14px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.on{opacity:1}
  .modal{position:fixed;inset:0;z-index:30;background:rgba(20,30,15,.55);display:none;align-items:center;justify-content:center;padding:14px}
  .modal.on{display:flex}
  .card{background:var(--ui);border:4px solid var(--ink);border-radius:20px;padding:16px;width:min(440px,100%);max-height:88vh;overflow:auto;box-shadow:0 6px 0 rgba(0,0,0,.35)}
  .card h2{margin:0 0 10px;font-size:22px}
  .row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:2px dashed #e2cfa8}
  .row:last-child{border-bottom:0}
  .row .grow{flex:1}
  .row .em{font-size:26px;width:34px;text-align:center}
  .muted{opacity:.7;font-size:13px}
  .tabs{display:flex;gap:6px;margin-bottom:8px}
  .tab{flex:1;height:40px;font-size:15px}
  .tab.on{background:var(--accent);color:#fff}
  input[type=text],input[type=password]{display:block;width:100%;font-size:18px;padding:10px 12px;border:3px solid var(--ink);border-radius:12px;font-family:inherit;background:#fff}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);cursor:pointer}
  .sw.on{outline:4px solid var(--accent);outline-offset:2px}
  #chatBar{position:fixed;z-index:25;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));display:none;gap:6px}
  #chatBar.on{display:flex}
  #chatLog{position:fixed;z-index:4;left:10px;top:calc(64px + env(safe-area-inset-top));max-width:min(320px,70vw);font-size:13px;pointer-events:none}
  #chatLog div{background:rgba(255,248,236,.85);border-radius:8px;padding:3px 8px;margin-bottom:3px;width:fit-content;max-width:100%;overflow-wrap:anywhere}
  #login .title{font-size:30px;font-weight:900;text-align:center;margin:0 0 4px;color:var(--green);text-shadow:2px 2px 0 var(--ink)}
  @media (max-width:560px){
    .hud{gap:5px}
    .pill{font-size:14px;padding:5px 8px;border-radius:12px}
    #topR .btn{min-width:40px;height:40px;font-size:17px;padding:0 6px;border-radius:12px}
    .wide{display:none}
    #toast{top:calc(62px + env(safe-area-inset-top))}
  }
  .badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700;color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="topL">
  <div class="pill" id="money">💰 0</div>
  <div class="pill" id="size">🟫 9</div>
</div>
<div class="hud" id="topR">
  <div class="pill" id="online" title="Çevrimiçi oyuncular">👥 1</div>
  <button class="btn" id="bHome" title="Tarlama git">🏠</button>
  <button class="btn" id="bBoard" title="Zenginler listesi">🏆</button>
  <button class="btn" id="bChat" title="Sohbet">💬</button>
</div>
<div id="chatLog"></div>
<div class="hud" id="hotbar"></div>
<button class="btn primary" id="action"></button>
<div id="toast"></div>
<div id="chatBar"><input type="text" id="chatIn" maxlength="80" placeholder="Bir şey yaz…" enterkeyhint="send"><button class="btn primary" id="chatSend">➤</button></div>

<!-- Giriş -->
<div class="modal on" id="login"><div class="card">
  <p class="title">🌾 Kanatlı Tarlalar ✈️</p>
  <p class="muted" style="text-align:center;margin-top:0">Tarlanı büyüt, uçağını al, en zengin çiftçi ol.</p>
  <div id="loading" style="text-align:center;padding:16px 0;font-weight:700">Bağlanıyor…</div>
  <!-- Giriş / Hesap aç -->
  <div id="authBox" style="display:none">
    <div class="tabs" id="authTabs"><button class="btn tab on" data-m="login">Giriş yap</button><button class="btn tab" data-m="signup">Hesap aç</button></div>
    <label><b>Kullanıcı adı</b></label>
    <input type="text" id="nameIn" maxlength="14" placeholder="Örn. Kerem" autocomplete="username" autocapitalize="off" spellcheck="false">
    <div id="pwWrap" style="margin-top:8px"><label><b>Şifre</b></label>
    <input type="password" id="pwIn" maxlength="40" placeholder="En az 6 karakter" autocomplete="current-password"></div>
    <div id="pw2Wrap" style="margin-top:8px;display:none"><label><b>Şifre (tekrar)</b></label>
    <input type="password" id="pw2In" maxlength="40" autocomplete="new-password"></div>
    <div id="colorWrap" style="display:none"><div style="margin-top:8px"><b>Karakter rengin</b></div><div class="swatches" id="swatches"></div></div>
    <button class="btn primary" id="play" style="width:100%;height:54px;font-size:20px;margin-top:10px">Giriş yap</button>
    <p class="muted" id="authHint" style="text-align:center;margin:6px 0 0"></p>
  </div>
  <!-- Kayıtlı oturum -->
  <div id="welcomeBox" style="display:none;text-align:center">
    <p style="font-size:18px">Tekrar hoş geldin, <b id="wName"></b> 👋</p>
    <button class="btn primary" id="wPlay" style="width:100%;height:54px;font-size:20px">Oyna</button>
    <button class="btn" id="wOut" style="width:100%;margin-top:8px;font-size:15px">Başka hesapla gir</button>
  </div>
  <p class="muted" id="modeInfo" style="text-align:center;margin-bottom:0"></p>
  <p class="muted" style="margin-bottom:0">📱 Sağ alttan sürükleyerek yürü, tarlaya dokunarak ek veya hasat et.<br>💻 WASD / ok tuşları ile yürü, E veya boşluk ile etkileşime geç, tıklayarak ek.</p>
</div></div>

<!-- Pazar / Hangar / Liste -->
<div class="modal" id="panel"><div class="card">
  <div style="display:flex;align-items:center;justify-content:space-between"><h2 id="pTitle"></h2><button class="btn" id="pClose">✕</button></div>
  <div id="pBody"></div>
</div></div>

<script type="module">
/* ============================================================
   FIREBASE AYARI
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBpk9IfRk2xMkwWZ420JaaJBpn-T3Wgu9M",
  authDomain: "kanatli-tarlalar.firebaseapp.com",
  databaseURL: "https://kanatli-tarlalar-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kanatli-tarlalar",
  storageBucket: "kanatli-tarlalar.firebasestorage.app",
  messagingSenderId: "901318029281",
  appId: "1:901318029281:web:f48848debd965a4ebcaca0",
};
const FB_VER = "10.12.2";

/* ---------------- Oyun verileri ---------------- */
const CROPS = {
  bugday:  {ad:'Buğday',  em:'🌾', tohum:5,   sure:60e3,    fiyat:12,  renk:'#e8c547', kilit:0},
  havuc:   {ad:'Havuç',   em:'🥕', tohum:15,  sure:180e3,   fiyat:35,  renk:'#f08a24', kilit:0},
  domates: {ad:'Domates', em:'🍅', tohum:40,  sure:600e3,   fiyat:100, renk:'#e0412f', kilit:12},
  misir:   {ad:'Mısır',   em:'🌽', tohum:90,  sure:1800e3,  fiyat:240, renk:'#f5d33a', kilit:20},
  cilek:   {ad:'Çilek',   em:'🍓', tohum:200, sure:7200e3,  fiyat:650, renk:'#e83a5a', kilit:30},
};
const CROP_IDS = Object.keys(CROPS);
const ITEMS = {
  gubre:{ad:'Gübre',         em:'🧪', acik:'Ekerken kullanılırsa ürün %40 daha hızlı büyür'},
  tel:  {ad:'Çit teli',      em:'🪢', acik:'Tarlayı 6×6\'dan büyük genişletmek için'},
  boru: {ad:'Sulama borusu', em:'🚰', acik:'Tarlayı 6×6\'dan büyük genişletmek için'},
};
const ITEM_IDS = Object.keys(ITEMS);
const PLANES = {
  c150:    {ad:'Hurda Cessna 150',     fiyat:1500,  menzil:150,  kap:10, yakit:80,   perKm:0.45, wear:1.6, start:{engine:55,airframe:60,inst:60}, tamir:5,  em:'🛩️', acik:'Eski, gürültülü, sık arıza yapar. Sadece yakın şehirlere gider.'},
  c172:    {ad:'Cessna 172',           fiyat:9000,  menzil:450,  kap:25, yakit:180,  perKm:0.36, wear:1.0, start:{engine:85,airframe:85,inst:90}, tamir:10, em:'🛩️', acik:'Güvenilir, orta menzil. İzmir ve Ankara\'ya gider.'},
  kingair: {ad:'Beechcraft King Air',  fiyat:45000, menzil:1300, kap:60, yakit:1400, perKm:0.95, wear:0.6, start:{engine:95,airframe:95,inst:95}, tamir:30, em:'✈️', acik:'Çift motorlu, hızlı, büyük yük. Her yere gider.'},
};
const CITIES = {
  bursa:   {ad:'Bursa',   km:90,  kiyi:false, carp:1.3, talep:'havuc',   satar:{gubre:18, tel:45},          yakitCarp:1.3},
  izmir:   {ad:'İzmir',   km:330, kiyi:true,  carp:1.5, talep:'domates', satar:{boru:80, tel:40, gubre:22}, yakitCarp:1.2},
  ankara:  {ad:'Ankara',  km:350, kiyi:false, carp:1.6, talep:'bugday',  satar:{boru:70, gubre:20},         yakitCarp:1.1},
  antalya: {ad:'Antalya', km:480, kiyi:true,  carp:1.8, talep:'cilek',   satar:{boru:65, tel:38},           yakitCarp:1.25},
};
const FUEL_PRICE = 1.5;
const COLORS = ['#e2504c','#3d7fe0','#f2b134','#8e5bd8','#2fa86a','#ec6fb0','#20b5c4','#7a5233'];
const MAX_W = 10, MAX_H = 8, MONEY_MAX = 6; // 6x6 sonrası şehir malzemesi gerekir
const LOT_UNLOCK = 6; // yeni arsa almak için tüm tarlalar en az 6x6
const newFarm = lot => ({lot, w:3, h:3, plots:{}});
const START = () => ({money:50, farms:[], seeds:{bugday:5}, crops:{}, items:{}, plane:null, trip:null});
const expandCost = f => Math.round(60*Math.pow(1.5,(f.w-3)+(f.h-3))/10)*10;
const expandMat = f => { const n=(f.w-3)+(f.h-3); return n>=6 ? {boru:n-4, tel:n-4} : null; };
const nextSize = f => ((f.w-3) <= (f.h-3) && f.w < MAX_W) ? {w:f.w+1,h:f.h} : (f.h < MAX_H ? {w:f.w,h:f.h+1} : {w:f.w+1,h:f.h});
const lotPrice = k => 5000*Math.pow(3,k-1); // k = sahip olunan tarla sayısı
const cropDur = pl => CROPS[pl.c] ? CROPS[pl.c].sure*(pl.g?0.6:1) : 1;

/* ---------------- Harita ---------------- */
const T = 32, MW = 86, MH = 80;
const G=0, PATH=1, WATER=2, TREE=3, BLD=4, RUN=5, LOT=6, FENCE=7, PLAZA=8, FLOWER=9;
const SOLID = new Set([WATER,TREE,BLD,FENCE]);
const tiles = new Uint8Array(MW*MH);
const ti = (x,y)=>y*MW+x;
const getT = (x,y)=> (x<0||y<0||x>=MW||y>=MH) ? TREE : tiles[ti(x,y)];
const setT = (x,y,v)=>{ if(x>=0&&y>=0&&x<MW&&y<MH) tiles[ti(x,y)]=v; };
const rect = (x0,y0,w,h,v)=>{ for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)setT(x,y,v); };
function hash(x,y){ let h = (x*374761393 + y*668265263) ^ 0x5bf03635; h = (h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967295; }

const LOT_X = [10,26,46,62], LOT_Y = [26,39,52,65], LOT_W = 14, LOT_H = 11, LOTS = 16;
const lotPos = n => ({x:LOT_X[n%4], y:LOT_Y[Math.floor(n/4)]});
const lotOrigin = n => { const p=lotPos(n); return {x:p.x+2, y:p.y+2}; };

const MARKET = {x:32,y:12,w:9,h:5, door:{x:36.5,y:17.8}};
const HANGAR = {x:58,y:12,w:7,h:5, door:{x:61.5,y:17.8}};
const parkSpot = n => ({x:68.2+(n%4)*4.2, y:10.6+Math.floor(n/4)*1.95});

(function buildMap(){
  rect(2,22,MW-4,2,PATH);
  rect(42,3,2,MH-5,PATH);
  for(const y of [37,50,63,76]) rect(8,y,MW-16,2,PATH);
  rect(8,24,MW-16,2,PATH);
  rect(38,17,10,5,PLAZA);
  for(let y=5;y<16;y++)for(let x=3;x<15;x++){ const dx=(x-9)/6.2, dy=(y-10.5)/5.6; if(dx*dx+dy*dy<1) setT(x,y,WATER); }
  rect(MARKET.x,MARKET.y,MARKET.w,MARKET.h,BLD);
  rect(MARKET.x+2,MARKET.y+MARKET.h,5,1,PLAZA); rect(MARKET.x+3,MARKET.y+MARKET.h+1,3,4,PLAZA);
  rect(HANGAR.x,HANGAR.y,HANGAR.w,HANGAR.h,BLD);
  rect(52,5,32,3,RUN);
  rect(60,8,3,4,RUN); rect(58,17,7,2,RUN); rect(65,8,19,10,RUN); rect(44,19,14,2,PATH);
  for(let n=0;n<LOTS;n++){
    const p=lotPos(n);
    for(let y=p.y;y<p.y+LOT_H;y++)for(let x=p.x;x<p.x+LOT_W;x++){
      const edge = x===p.x||x===p.x+LOT_W-1||y===p.y||y===p.y+LOT_H-1;
      setT(x,y, edge?FENCE:LOT);
    }
    setT(p.x+6,p.y,LOT); setT(p.x+7,p.y,LOT); setT(p.x+6,p.y+LOT_H-1,LOT); setT(p.x+7,p.y+LOT_H-1,LOT);
  }
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
    if(x<2||y<2||x>=MW-2||y>=MH-2){ if(getT(x,y)===G||getT(x,y)===PATH) setT(x,y,TREE); continue; }
    if(getT(x,y)!==G) continue;
    const r=hash(x,y);
    const nearRoad = [[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const t=getT(x+a,y+b);return t!==G&&t!==TREE&&t!==FLOWER;});
    if(!nearRoad && r<(y<22?0.10:0.05)) setT(x,y,TREE);
    else if(r>0.965) setT(x,y,FLOWER);
  }
  rect(30,18,13,4,G); rect(MARKET.x+2,MARKET.y+MARKET.h,5,1,PLAZA); rect(MARKET.x+3,MARKET.y+MARKET.h+1,3,4,PLAZA);
})();

/* ---------------- Durum ---------------- */
const S = {
  online:false, uid:null, me:null, name:'', color:COLORS[0],
  x:43, y:21, dir:0, moving:false, sel:'bugday', useGubre:false, loadCargo:true,
  mode:'village', status:'',
  others:new Map(), players:{}, timeOffset:0,
};
const now = ()=> Date.now()+S.timeOffset;
let FB = null;

/* ---------------- Yardımcılar ---------------- */
const $ = id=>document.getElementById(id);
const fmtMoney = n => Math.round(n).toLocaleString('tr-TR');
function fmtTime(ms){ ms=Math.max(0,ms); const s=Math.ceil(ms/1000); if(s<60) return s+' sn'; const m=Math.floor(s/60); if(m<60) return m+' dk '+(s%60? (s%60)+' sn':''); const h=Math.floor(m/60); return h+' sa '+(m%60)+' dk'; }
let toastT=0; function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const objVals = o => !o ? [] : (Array.isArray(o) ? o.filter(Boolean) : Object.values(o));
// Kayıtlı veriyi tarlalar listesine çevir (eski kayıtlarla uyumlu)
function farmsOf(p){
  if(!p) return [];
  if(p.farms) return p.farms;
  const out=[];
  if(p.lot!=null && p.lot>=0) out.push({lot:p.lot, w:p.w||3, h:p.h||3, plots:p.plots||{}});
  for(const f of objVals(p.ek)) out.push({lot:f.lot, w:f.w||3, h:f.h||3, plots:f.plots||{}});
  return out;
}
const plotCount = p => farmsOf(p).reduce((a,f)=>a+f.w*f.h,0);
const plantedCount = p => farmsOf(p).reduce((a,f)=>a+Object.keys(f.plots||{}).length,0);
function loadMe(d){
  const me = {...START(), ...d};
  me.farms = farmsOf(d).map(f=>({...f, plots:{...(f.plots||{})}}));
  me.seeds = {...(d.seeds||{})}; me.crops = {...(d.crops||{})}; me.items = {...(d.items||{})};
  me.plane = d.plane ? {...d.plane, cond:{...d.plane.cond}} : null;
  me.trip = d.trip || null;
  if(me.trip && me.trip.cargo){ me.trip.cargo = {crops:{...(me.trip.cargo.crops||{})}, items:{...(me.trip.cargo.items||{})}}; }
  delete me.lot; delete me.w; delete me.h; delete me.plots; delete me.ek;
  return me;
}

/* ---------------- Kayıt ---------------- */
let saveTimer=0;
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,400); renderHUD(); }
function serialize(){
  const me=S.me, f0=me.farms[0]||{lot:-1,w:0,h:0,plots:{}};
  return {name:S.name, color:S.color, money:Math.max(0,Math.round(me.money)),
    lot:f0.lot, w:f0.w, h:f0.h, plots:f0.plots, ek:me.farms.slice(1),
    seeds:me.seeds, crops:me.crops, items:me.items, plane:me.plane||null, trip:me.trip||null, updated:Date.now()};
}
function saveNow(){
  clearTimeout(saveTimer);
  const data = serialize();
  if(S.online){ FB.set(FB.ref(FB.db,'players/'+S.uid), data).catch(e=>toast('Kaydedilemedi: '+(e.code||e.message))); }
  else { try{ localStorage.setItem('tk_save', JSON.stringify(data)); }catch(e){} }
  S.players[S.uid] = data;
}

/* ---------------- Firebase ---------------- */
const hasConfig = !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey);
$('modeInfo').innerHTML = hasConfig ? '🟢 Çevrimiçi mod: herkes aynı köyde.' : '🟡 Test modu: Firebase bağlı değil, tek kişilik.';
let FBA = null;
async function loadFirebase(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [app, auth, db] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-database.js')]);
  const fbApp = app.initializeApp(FIREBASE_CONFIG);
  FBA = {...auth, a:auth.getAuth(fbApp)};
  FB = {...db, db:db.getDatabase(fbApp)};
}
function firstAuthState(){ return new Promise(res=>{ const off = FBA.onAuthStateChanged(FBA.a, u=>{ off(); res(u); }); }); }
const TRMAP = {'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u'};
function nickKey(n){ return n.toLocaleLowerCase('tr-TR').replace(/[çğıöşü]/g,c=>TRMAP[c]).replace(/[^a-z0-9_]/g,''); }
const nickEmail = n => nickKey(n)+'@'+(FIREBASE_CONFIG.authDomain||'oyun.local');

async function enterOnline(user){
  S.uid = user.uid; S.online = true;
  FB.onValue(FB.ref(FB.db,'.info/serverTimeOffset'), s=>{ S.timeOffset = s.val()||0; });
  const snap = await FB.get(FB.ref(FB.db,'players/'+S.uid));
  if(snap.exists()){
    const d=snap.val(); S.me = loadMe(d);
    S.name = d.name || S.name; S.color = d.color || S.color;
  } else {
    S.me = START();
    if(!S.name) S.name = (user.email||'oyuncu').split('@')[0];
  }
  if(!S.me.farms.length){
    const n = await claimAnyLot();
    if(n<0) throw new Error('Köy dolu! Şu an boş arsa yok.');
    S.me.farms.push(newFarm(n));
  }
  saveNow();
  FB.onValue(FB.ref(FB.db,'players'), s=>{
    const all = s.val()||{};
    for(const id in all){ if(id!==S.uid) S.players[id]=all[id]; }
    for(const id in S.players){ if(id!==S.uid && !all[id]) delete S.players[id]; }
    if($('panel').dataset.kind==='board') openBoard();
  });
  const pres = FB.ref(FB.db,'presence');
  const upd = s=>{
    if(s.key===S.uid) return;
    const v=s.val(); if(!v) return;
    let o=S.others.get(s.key);
    if(!o){ o={x:v.x,y:v.y,msgShown:0}; S.others.set(s.key,o); if(v.mt && Date.now()-v.mt>8000) o.msgShown=v.mt; }
    o.tx=v.x; o.ty=v.y; o.name=v.n; o.color=v.c; o.dir=v.d; o.moving=!!v.m; o.t=v.t; o.st=v.st||'';
    if(v.mt && v.mt!==o.msgShown){ o.msg=v.msg; o.msgShown=v.mt; o.msgLocal=performance.now(); addChatLog(v.n, v.msg); }
  };
  FB.onChildAdded(pres, upd);
  FB.onChildChanged(pres, upd);
  FB.onChildRemoved(pres, s=>S.others.delete(s.key));
  const myPres = FB.ref(FB.db,'presence/'+S.uid);
  FB.onDisconnect(myPres).remove();
  FB.onValue(FB.ref(FB.db,'.info/connected'), s=>{ if(s.val()){ FB.onDisconnect(myPres).remove(); sendPresence(true); } });
}
async function logout(){
  if(!S.online){ location.reload(); return; }
  try{ await FB.remove(FB.ref(FB.db,'presence/'+S.uid)); }catch(e){}
  await FBA.signOut(FBA.a);
  location.reload();
}
async function claimLot(n){
  if(!S.online){ return lotInfo()[n] ? false : true; }
  const r = await FB.runTransaction(FB.ref(FB.db,'lots/'+n), cur => (cur===null||cur===S.uid) ? S.uid : undefined);
  return r.committed && r.snapshot.val()===S.uid;
}
async function claimAnyLot(){
  for(let n=0;n<LOTS;n++){ if(await claimLot(n)) return n; }
  return -1;
}

let lastPres=0, lastSent='', myMsg='', myMsgT=0;
function sendPresence(force){
  if(!S.online) return;
  const t=performance.now();
  if(!force && t-lastPres<150) return;
  const key = `${S.x.toFixed(2)},${S.y.toFixed(2)},${S.dir},${S.moving},${S.status}`;
  if(!force && key===lastSent && t-lastPres<10000) return;
  lastPres=t; lastSent=key;
  FB.set(FB.ref(FB.db,'presence/'+S.uid), {n:S.name, c:S.color, x:+S.x.toFixed(2), y:+S.y.toFixed(2), d:S.dir, m:S.moving?1:0, t:FB.serverTimestamp(), msg:myMsg, mt:myMsgT, st:S.status||''}).catch(()=>{});
}

/* ---------------- Giriş ekranı ---------------- */
function homePos(){ const f=S.me.farms[0]; const o=lotOrigin(f?f.lot:0); return {x:o.x+4.5, y:o.y-1.3}; }
function startGame(){
  const h=homePos(); S.x=h.x; S.y=h.y;
  $('login').classList.remove('on');
  // yarım kalan uçuş?
  const tr=S.me.trip;
  if(tr && tr.flying){
    if(tr.from==='koy'){ unloadCargo(tr.cargo); S.me.trip=null; }
    else S.me.trip={at:tr.from, cargo:tr.cargo};
    toast('Uçuşun yarıda kaldı — kalkış noktasına döndün');
    saveNow();
  }
  renderHUD(); loop.started || requestAnimationFrame(loop);
  if(S.me.trip && S.me.trip.at){ enterCity(); }
  else toast(S.online?'Köye hoş geldin, '+S.name+'!':'Test modu: tek kişilik');
}
const AUTH_ERR = {
  'auth/email-already-in-use':'Bu kullanıcı adı alınmış, başka bir tane dene',
  'auth/invalid-credential':'Kullanıcı adı veya şifre yanlış',
  'auth/invalid-login-credentials':'Kullanıcı adı veya şifre yanlış',
  'auth/wrong-password':'Kullanıcı adı veya şifre yanlış',
  'auth/user-not-found':'Böyle bir kullanıcı yok — önce "Hesap aç"',
  'auth/weak-password':'Şifre en az 6 karakter olmalı',
  'auth/too-many-requests':'Çok fazla deneme yaptın, biraz bekle',
  'auth/network-request-failed':'İnternet bağlantısı yok gibi',
  'auth/operation-not-allowed':'Firebase\'de E-posta/Şifre girişi açık değil (kurulum adımı)',
};
(function(){
  let mode='login';
  const playBtn=$('play');
  const sw=$('swatches');
  S.color = COLORS[Math.floor(Math.random()*COLORS.length)];
  COLORS.forEach(c=>{ const d=document.createElement('div'); d.className='sw'+(c===S.color?' on':''); d.style.background=c; d.onclick=()=>{ S.color=c; [...sw.children].forEach(e=>e.classList.toggle('on',e===d)); }; sw.appendChild(d); });
  const setMode=m=>{
    mode=m;
    [...$('authTabs').children].forEach(b=>b.classList.toggle('on',b.dataset.m===m));
    $('pw2Wrap').style.display = m==='signup'?'block':'none';
    $('colorWrap').style.display = m==='signup'?'block':'none';
    $('pwIn').autocomplete = m==='signup'?'new-password':'current-password';
    playBtn.textContent = m==='signup'?'Hesap aç ve oyna':'Giriş yap';
    $('authHint').textContent = m==='signup'?'İlk tarlan bedava! Şifreni unutma: aynı ad ve şifreyle telefondan da bilgisayardan da girersin.':'';
  };
  $('authTabs').onclick=e=>{ const b=e.target.closest('button'); if(b) setMode(b.dataset.m); };
  const show=id=>{ for(const x of ['loading','authBox','welcomeBox']) $(x).style.display = x===id?'block':'none'; };

  if(!hasConfig){
    show('authBox'); $('authTabs').style.display='none'; $('pwWrap').style.display='none'; $('colorWrap').style.display='block';
    playBtn.textContent='Oyna (test)';
    playBtn.onclick=()=>{
      const name=$('nameIn').value.trim(); if(name.length<2){ toast('Adın en az 2 harf olsun'); return; }
      S.name=name; S.uid='local';
      let d=null; try{ d=JSON.parse(localStorage.getItem('tk_save')||'null'); }catch(e){}
      S.me = d ? loadMe(d) : START();
      if(!S.me.farms.length) S.me.farms.push(newFarm(0));
      saveNow(); startGame();
    };
    return;
  }
  const go = async (fn)=>{
    const old=playBtn.textContent; playBtn.disabled=true; $('wPlay').disabled=true; playBtn.textContent='Bağlanıyor…';
    try{ await fn(); startGame(); }
    catch(e){ console.error(e); toast(AUTH_ERR[e.code] || ('Hata: '+(e.message||e.code||e))); playBtn.textContent=old; }
    playBtn.disabled=false; $('wPlay').disabled=false;
  };
  playBtn.onclick=()=>go(async()=>{
    const name=$('nameIn').value.trim(), pw=$('pwIn').value;
    if(!/^[A-Za-z0-9_ÇĞİÖŞÜçğıöşü]{3,14}$/.test(name)) throw {code:'x',message:'Kullanıcı adı 3–14 harf/rakam olmalı (boşluk yok)'};
    if(pw.length<6) throw {code:'auth/weak-password'};
    if(mode==='signup'){
      if(pw!==$('pw2In').value) throw {code:'x',message:'Şifreler aynı değil'};
      const cred = await FBA.createUserWithEmailAndPassword(FBA.a, nickEmail(name), pw);
      S.name=name; await enterOnline(cred.user);
    } else {
      const cred = await FBA.signInWithEmailAndPassword(FBA.a, nickEmail(name), pw);
      S.name=''; await enterOnline(cred.user);
    }
  });
  const onEnter=e=>{ if(e.key==='Enter') playBtn.click(); };
  $('nameIn').addEventListener('keydown',onEnter); $('pwIn').addEventListener('keydown',onEnter); $('pw2In').addEventListener('keydown',onEnter);
  $('wOut').onclick=async()=>{ await FBA.signOut(FBA.a); show('authBox'); };
  (async()=>{
    try{
      await loadFirebase();
      const u = await firstAuthState();
      if(u && !u.isAnonymous){
        let nm=(u.email||'').split('@')[0];
        try{ const s=await FB.get(FB.ref(FB.db,'players/'+u.uid+'/name')); if(s.exists()) nm=s.val(); }catch(e){}
        $('wName').textContent=nm; show('welcomeBox');
        $('wPlay').onclick=()=>go(()=>enterOnline(u));
      } else {
        if(u && u.isAnonymous) await FBA.signOut(FBA.a);
        show('authBox'); setMode('login');
      }
    }catch(e){ console.error(e); $('loading').textContent='Sunucuya bağlanılamadı. Sayfayı yenile.'; }
  })();
})();

/* ---------------- HUD ---------------- */
function unlocked(id){ return plotCount(S.me) >= CROPS[id].kilit; }
function renderHUD(){
  if(!S.me) return;
  const me=S.me;
  $('money').textContent = '💰 '+fmtMoney(me.money);
  $('size').innerHTML = '🟫 '+plotCount(me)+'<span class="wide"> parsel</span>';
  const hb=$('hotbar'); hb.innerHTML='';
  const vis = S.mode==='village';
  $('hotbar').style.display = vis?'flex':'none';
  for(const id of CROP_IDS){
    if(!unlocked(id) && !(me.seeds[id]>0)) continue;
    const n=me.seeds[id]||0;
    const d=document.createElement('div');
    d.className='slot'+(S.sel===id?' sel':'')+(n?'':' empty');
    d.innerHTML=`${CROPS[id].em}<small>${n}</small>`;
    d.title=CROPS[id].ad+' tohumu';
    d.onclick=()=>{ S.sel=id; renderHUD(); toast(CROPS[id].ad+' seçildi'); };
    hb.appendChild(d);
  }
  if((me.items.gubre||0)>0){
    const d=document.createElement('div'); d.className='slot'+(S.useGubre?' sel':''); d.innerHTML=`🧪<small>${me.items.gubre}</small>`; d.title='Gübre kullan (aç/kapat)';
    d.onclick=()=>{ S.useGubre=!S.useGubre; renderHUD(); toast(S.useGubre?'Gübre açık: ekinler %40 hızlı büyür':'Gübre kapalı'); }; hb.appendChild(d);
  }
  const b=document.createElement('div'); b.className='slot'; b.innerHTML='🎒<small>'+(Object.values(me.crops).reduce((a,b)=>a+b,0)+Object.values(me.items).reduce((a,b)=>a+b,0))+'</small>'; b.title='Çanta';
  b.onclick=()=>toast(sepetText()); hb.appendChild(b);
}
function sepetText(){
  const me=S.me;
  const parts=CROP_IDS.filter(i=>me.crops[i]>0).map(i=>CROPS[i].em+' '+me.crops[i]).concat(ITEM_IDS.filter(i=>me.items[i]>0).map(i=>ITEMS[i].em+' '+me.items[i]));
  return parts.length?'Çanta: '+parts.join('  '):'Çantan boş';
}

/* ---------------- Tarla mantığı ---------------- */
function plotFromTile(tx,ty){
  for(let n=0;n<LOTS;n++){
    const o=lotOrigin(n);
    const px=tx-o.x, py=ty-o.y;
    if(px>=0&&py>=0&&px<MAX_W&&py<MAX_H) return {n,px,py};
  }
  return null;
}
function lotAtTile(tx,ty){ for(let n=0;n<LOTS;n++){ const p=lotPos(n); if(tx>=p.x&&tx<p.x+LOT_W&&ty>=p.y&&ty<p.y+LOT_H) return n; } return -1; }
// her arsa kime ait? {uid, farm, p}
function lotInfo(){
  const m={};
  for(const id in S.players){
    const p = id===S.uid ? S.me : S.players[id]; if(!p) continue;
    for(const f of farmsOf(p)) if(f.lot>=0 && f.lot<LOTS) m[f.lot]={uid:id, farm:f, p};
  }
  return m;
}
function myFarm(n){ return S.me.farms.find(f=>f.lot===n); }
function cropStage(pl){ const p=(now()-pl.t)/cropDur(pl); return p>=1?3:(p>0.5?2:(p>0.15?1:0)); }

function actPlot(n,px,py){
  const me=S.me, f=myFarm(n); if(!f) return;
  if(px>=f.w||py>=f.h){ toast('Bu kısım henüz açılmadı — Pazar\'dan arazi genişlet'); return; }
  const k=px+'_'+py, pl=f.plots[k];
  if(!pl){
    const id=S.sel;
    if(!unlocked(id)){ toast(CROPS[id].ad+' için '+CROPS[id].kilit+' parsel lazım'); return; }
    if(!(me.seeds[id]>0)){ toast(CROPS[id].ad+' tohumun yok — Pazar\'dan al'); return; }
    me.seeds[id]--;
    const np={c:id,t:now()};
    if(S.useGubre && me.items.gubre>0){ me.items.gubre--; np.g=1; if(!me.items.gubre) S.useGubre=false; }
    f.plots[k]=np;
    puff(n,px,py,'#8b5a2b'); saveSoon(); return;
  }
  const c=CROPS[pl.c], left=pl.t+cropDur(pl)-now();
  if(left>0){ toast(c.em+' '+c.ad+': '+fmtTime(left)+' kaldı'+(pl.g?' 🧪':'')); return; }
  delete f.plots[k];
  me.crops[pl.c]=(me.crops[pl.c]||0)+1;
  puff(n,px,py,c.renk); floatText(n,px,py,'+1 '+c.em); saveSoon();
}
function canBuyLot(){ return S.me.farms.every(f=>f.w>=LOT_UNLOCK && f.h>=LOT_UNLOCK); }
async function buyLot(n){
  const me=S.me, price=lotPrice(me.farms.length);
  if(lotInfo()[n]){ toast('Bu arsa satılmış'); return; }
  if(!canBuyLot()){ toast('Önce tüm tarlalarını en az 6×6 yap'); return; }
  if(me.money<price){ toast('Paran yetmiyor (💰'+fmtMoney(price)+')'); return; }
  const ok = await claimLot(n);
  if(!ok){ toast('Bu arsayı başkası kaptı!'); return; }
  me.money-=price; me.farms.push(newFarm(n)); saveNow(); renderHUD(); closePanel();
  toast('🎉 Yeni tarla senin! Arsa '+(n+1));
}
function openLotSale(n){
  const me=S.me, price=lotPrice(me.farms.length), ok=canBuyLot();
  openPanel('lot','🏷️ Satılık arsa',`
    <p>Bu arsayı alırsan yeni bir 3×3 tarla açılır ve onu da büyütebilirsin. Zenginlik sıralamasında bütün tarlaların toplamı sayılır.</p>
    <div class="row"><span class="em">🏷️</span><div class="grow"><b>Fiyat: 💰${fmtMoney(price)}</b><div class="muted">${me.farms.length}. tarlandan sonra fiyat artar</div></div>
    <button class="btn primary" data-buylot="${n}" ${ok&&me.money>=price?'':'disabled'}>Satın al</button></div>
    ${ok?'':'<p class="muted">🔒 Önce sahip olduğun her tarlayı en az 6×6 yapmalısın.</p>'}`);
}

const panel=$('panel');
function openPanel(kind,title,html,locked){ panel.dataset.kind=kind; $('pTitle').textContent=title; $('pBody').innerHTML=html; $('pClose').style.display=locked?'none':''; panel.classList.add('on'); }
function closePanel(){ if(panel.dataset.kind==='city') return; panel.classList.remove('on'); panel.dataset.kind=''; }
$('pClose').onclick=closePanel;
panel.addEventListener('pointerdown',e=>{ if(e.target===panel) closePanel(); });

let shopTab='sat';
function cropPrice(id, city){ const c=CROPS[id]; if(!city) return c.fiyat; const C=CITIES[city]; return Math.round(c.fiyat*C.carp*(C.talep===id?1.6:1)); }
function openShop(tab){
  if(tab) shopTab=tab;
  const me=S.me;
  let h=`<div class="tabs"><button class="btn tab ${shopTab==='sat'?'on':''}" data-tab="sat">Sat</button><button class="btn tab ${shopTab==='tohum'?'on':''}" data-tab="tohum">Tohum</button><button class="btn tab ${shopTab==='arazi'?'on':''}" data-tab="arazi">Arazi</button></div>`;
  h+=`<p class="muted" style="margin:0 0 6px">Paran: <b>💰 ${fmtMoney(me.money)}</b></p>`;
  if(shopTab==='sat'){
    let any=false;
    for(const id of CROP_IDS){ const n=me.crops[id]||0; if(!n) continue; any=true; const c=CROPS[id];
      h+=`<div class="row"><span class="em">${c.em}</span><div class="grow"><b>${c.ad}</b> ×${n}<div class="muted">tanesi 💰${c.fiyat}</div></div><button class="btn" data-sell="${id}">Sat (${fmtMoney(n*c.fiyat)})</button></div>`; }
    if(!any) h+='<p>Çantanda ürün yok. Tarlana ekip hasat et, sonra burada sat.</p>';
    else h+=`<button class="btn primary" style="width:100%;margin-top:8px" data-sell="*">Hepsini sat</button><p class="muted">💡 Şehirlerde ürünler daha pahalıya satılır — uçağın varsa oraya götür!</p>`;
  } else if(shopTab==='tohum'){
    for(const id of CROP_IDS){ const c=CROPS[id]; const ok=unlocked(id);
      h+=`<div class="row"><span class="em">${c.em}</span><div class="grow"><b>${c.ad}</b> <span class="muted">(${me.seeds[id]||0} adet)</span><div class="muted">${ok?`Büyüme ${fmtTime(c.sure)} · satış 💰${c.fiyat}`:`🔒 ${c.kilit} parsel tarla gerekir`}</div></div>
      ${ok?`<button class="btn" data-buy="${id}" data-n="1">💰${c.tohum}</button><button class="btn" data-buy="${id}" data-n="5">×5</button>`:''}</div>`; }
  } else {
    me.farms.forEach((f,i)=>{
      h+=`<div class="row"><span class="em">🟫</span><div class="grow"><b>Tarla ${i+1}</b> — ${f.w}×${f.h} = ${f.w*f.h} parsel<div class="muted">Arsa ${f.lot+1}</div></div></div>`;
      if(f.w>=MAX_W && f.h>=MAX_H){ h+='<p class="muted" style="margin:0 0 6px 44px">En büyük boyutta 🎉</p>'; return; }
      const ns=nextSize(f), cost=expandCost(f), mat=expandMat(f);
      const matOk = !mat || ((me.items.boru||0)>=mat.boru && (me.items.tel||0)>=mat.tel);
      h+=`<div class="row" style="padding-left:44px"><div class="grow">Genişlet → <b>${ns.w}×${ns.h}</b> (+${ns.w*ns.h-f.w*f.h})
        ${mat?`<div class="muted">Gerekli: 🚰 ${mat.boru} boru (${me.items.boru||0} var) · 🪢 ${mat.tel} tel (${me.items.tel||0} var)<br>Bunlar şehirlerde satılır ✈️</div>`:''}</div>
        <button class="btn primary" data-expand="${i}" ${me.money>=cost&&matOk?'':'disabled'}>💰${fmtMoney(cost)}</button></div>`;
    });
    h+=`<div class="row"><span class="em">🏷️</span><div class="grow"><b>Yeni arsa al</b><div class="muted">${canBuyLot()?`Köydeki boş bir arsaya git ve tabelasına dokun. Fiyat: 💰${fmtMoney(lotPrice(me.farms.length))}`:'Her tarlan en az 6×6 olunca yeni arsa alabilirsin.'}</div></div></div>`;
    h+=`<p class="muted">Kilitli ürünler: ${CROP_IDS.filter(i=>!unlocked(i)).map(i=>CROPS[i].em+' '+CROPS[i].kilit+' parsel').join(' · ')||'hepsi açık'}</p>`;
  }
  openPanel('shop','🛒 Köy Pazarı',h);
}
$('pBody').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  const me=S.me, d=b.dataset;
  if(d.logout!==undefined){ logout(); return; }
  if(d.tab){ openShop(d.tab); return; }
  if(d.sell){
    const ids = d.sell==='*'?CROP_IDS:[d.sell]; let gain=0;
    for(const id of ids){ const n=me.crops[id]||0; gain+=n*CROPS[id].fiyat; me.crops[id]=0; }
    me.money+=gain; if(gain) toast('+💰'+fmtMoney(gain)); saveSoon(); openShop(); return;
  }
  if(d.buy){
    const id=d.buy, n=+d.n, cost=CROPS[id].tohum*n;
    if(me.money<cost){ toast('Paran yetmiyor'); return; }
    me.money-=cost; me.seeds[id]=(me.seeds[id]||0)+n; S.sel=id; saveSoon(); openShop(); return;
  }
  if(d.expand!==undefined){
    const f=me.farms[+d.expand], cost=expandCost(f), mat=expandMat(f);
    if(me.money<cost){ toast('Paran yetmiyor'); return; }
    if(mat){ if((me.items.boru||0)<mat.boru||(me.items.tel||0)<mat.tel){ toast('Malzeme eksik'); return; } me.items.boru-=mat.boru; me.items.tel-=mat.tel; }
    const ns=nextSize(f); me.money-=cost; f.w=ns.w; f.h=ns.h; toast('Tarlan büyüdü! 🎉 '+f.w+'×'+f.h); saveSoon(); openShop(); return;
  }
  if(d.buylot!==undefined){ buyLot(+d.buylot); return; }
  // hangar
  if(d.buyplane){ buyPlane(d.buyplane); return; }
  if(d.repair){ repairPlane(d.repair, false); return; }
  if(d.refuel!==undefined){ refuel(false); return; }
  if(d.fly){ depart(d.fly); return; }
  if(d.htab){ hangarTab=d.htab; openHangar(); return; }
  if(d.cargo!==undefined){ S.loadCargo=!S.loadCargo; openHangar(); return; }
  // şehir
  if(d.ctab){ cityTab=d.ctab; openCityPanel(); return; }
  if(d.csell){ citySell(d.csell); return; }
  if(d.cbuy){ cityBuy(d.cbuy, +d.n); return; }
  if(d.crefuel!==undefined){ refuel(true); return; }
  if(d.crepair!==undefined){ repairPlane('engine', true); return; }

});

    const need=PD.yakit-pl.fuel, fc=Math.ceil(need*FUEL_PRICE);

function buyPlane(id){
  const me=S.me, P=PLANES[id];
  let cost=P.fiyat;
  if(me.plane){ const PD=PLANES[me.plane.model]; cost=Math.max(0,P.fiyat-Math.round(PD.fiyat*0.5*(0.5+0.5*(me.plane.cond.engine+me.plane.cond.airframe)/200))); }
  if(me.money<cost){ toast('Paran yetmiyor'); return; }
  me.money-=cost; me.plane={model:id, cond:{...P.start}, fuel:Math.round(P.yakit*0.5), hours:0};
  hangarTab='ucak'; saveSoon(); openHangar(); toast('🎉 '+P.ad+' artık senin! Apronda duruyor.');
}
function repairPlane(part, city){
  const me=S.me, pl=me.plane;
  if(city){ // şehirde acil tamir: motoru 35'e çıkar
    const target=35, c=Math.round((target-pl.cond.engine)*PLANES[pl.model].tamir*2.5);
    if(pl.cond.engine>=target) return; if(me.money<c){ toast('Paran yetmiyor'); return; }
    me.money-=c; pl.cond.engine=target; saveSoon(); openCityPanel(); toast('Motor geçici olarak toparlandı'); return;
  }
  const c=repairCost(pl,part,false); if(me.money<c){ toast('Paran yetmiyor'); return; }
  me.money-=c; pl.cond[part]=100; saveSoon(); openHangar(); toast('🔧 Tamir edildi');
}
function refuel(city){
  const me=S.me, pl=me.plane, PD=PLANES[pl.model];
  const price = FUEL_PRICE*(city?CITIES[me.trip.at].yakitCarp:1);
  let liters = PD.yakit-pl.fuel; const affordable = Math.floor(me.money/price);
  if(liters>affordable){
    if(city){ // şehirde mahsur kalmasın: eve dönecek kadar yakıtı borçla ver
      const need=Math.ceil(CITIES[me.trip.at].km*PD.perKm*1.1)-pl.fuel;
      if(affordable<need){ pl.fuel+=Math.max(0,need); me.money=0; saveSoon(); openCityPanel(); toast('Paran yetmedi — belediye eve dönüş yakıtını verdi'); return; }
    }
    liters=affordable;
  }
  if(liters<=0){ toast('Paran yetmiyor'); return; }
  pl.fuel+=liters; me.money-=liters*price; saveSoon(); city?openCityPanel():openHangar(); toast('⛽ +'+Math.round(liters)+' L');
}
function rollFailures(pl){
  const f=[], e=pl.cond.engine, a=pl.cond.airframe, i=pl.cond.inst;
  if(Math.random() < (100-e)/100*0.7) f.push({type: (e<35&&Math.random()<0.55)?'engine_out':'rough', at:35+Math.random()*80});
  if(Math.random() < (100-a)/100*0.4) f.push({type:'fuel_leak', at:30+Math.random()*90});
  if(Math.random() < (100-i)/100*0.6) f.push({type:Math.random()<0.5?'asi':'alt', at:20+Math.random()*100});
  return f;
}
function unloadCargo(cg){ if(!cg) return; const me=S.me; for(const [k,v] of Object.entries(cg.crops||{})) me.crops[k]=(me.crops[k]||0)+v; for(const [k,v] of Object.entries(cg.items||{})) me.items[k]=(me.items[k]||0)+v; }
const cargoCount = cg => !cg?0:Object.values(cg.crops||{}).reduce((a,b)=>a+b,0)+Object.values(cg.items||{}).reduce((a,b)=>a+b,0);
function setVillageUI(on){ for(const id of ['topL','topR','hotbar','action','chatLog']) { const e=$(id); if(e) e.style.visibility=on?'visible':'hidden'; } }

async function depart(toKey){
  const me=S.me, pl=me.plane, PD=PLANES[pl.model];
  const fromKey = (me.trip && me.trip.at) || 'koy';
  const km = toKey==='koy' ? CITIES[fromKey].km : CITIES[toKey].km;
  if(pl.cond.engine<=0){ toast('Motor çalışmıyor'); return; }
  if(pl.fuel < km*PD.perKm*1.05){ toast('Yakıt yetmez'); return; }
  let cargo;
  if(fromKey==='koy'){
    cargo={crops:{},items:{}};
    if(S.loadCargo){ let space=PD.kap; const ids=CROP_IDS.slice().sort((a,b)=>CROPS[b].fiyat-CROPS[a].fiyat);
      for(const id of ids){ const n=Math.min(me.crops[id]||0, space); if(n>0){ cargo.crops[id]=n; me.crops[id]-=n; space-=n; } } }
  } else cargo = me.trip.cargo || {crops:{},items:{}};
  const toName = toKey==='koy'?'Köy':CITIES[toKey].ad, fromName = fromKey==='koy'?'Köy':CITIES[fromKey].ad;
  me.trip = {from:fromKey, to:toKey, flying:true, cargo};
  S.mode='flight'; S.status='✈️ '+toName+' yolunda'; saveNow(); sendPresence(true);
  panel.classList.remove('on'); panel.dataset.kind=''; setVillageUI(false);
  const failures = rollFailures(pl);
  const res = await startFlight({
    model:pl.model, color:S.color, seed:Math.floor(Math.random()*1e6)+1,
    from:{kind:fromKey==='koy'?'koy':'sehir', name:fromName}, to:{kind:toKey==='koy'?'koy':'sehir', name:toName, coastal:toKey!=='koy'&&CITIES[toKey].kiyi},
    fuelL:pl.fuel, fuelCap:PD.yakit, perKm:PD.perKm, distKm:km, failures,
  });
  handleFlightResult(res, fromKey, toKey);
}
function handleFlightResult(res, fromKey, toKey){
  const me=S.me, pl=me.plane, PD=PLANES[pl.model], cargo=me.trip.cargo;
  pl.fuel = Math.max(0, res.fuelLeft);
  if(res.tookOff){
    pl.hours=(pl.hours||0)+1;
    pl.cond.engine -= (2+Math.random()*3)*PD.wear; pl.cond.inst -= (1+Math.random()*2)*PD.wear; pl.cond.airframe -= PD.wear;
  }
  pl.cond.engine -= res.damage.engine||0; pl.cond.airframe -= res.damage.airframe||0; pl.cond.inst -= res.damage.inst||0;
  for(const k in pl.cond) pl.cond[k]=Math.max(0,Math.min(100,pl.cond[k]));
  let at, msg='';
  const tow = Math.round(PD.fiyat*0.05);
  switch(res.outcome){
    case 'landed': at=toKey; break;
    case 'forced': if(res.nearDest){ at=toKey; } else at=fromKey; me.money=Math.max(0,me.money-tow); msg='Çekici ücreti 💰'+fmtMoney(tow); break;
    case 'crash': at=fromKey; me.money=Math.max(0,me.money-tow*2); cargo.crops={}; cargo.items={}; msg='Kaza! Çekici ücreti 💰'+fmtMoney(tow*2)+', yük kayboldu'; break;
    default: at=fromKey;
  }
  if(at==='koy'){ unloadCargo(cargo); me.trip=null; S.mode='village'; S.status=''; }
  else { me.trip={at, cargo}; }
  saveNow(); setVillageUI(true);
  if(me.trip){ enterCity(); }
  else { const ps=parkSpot(me.farms[0].lot); S.x=HANGAR.door.x; S.y=HANGAR.door.y+0.6; renderHUD(); sendPresence(true); }
  if(msg) toast(msg); else if(res.outcome==='landed' && at==='koy') toast('Köye döndün! Yük çantana aktarıldı 🎒');
}

const cv=$('c'), ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1,Z=1;
function resize(){ DPR=Math.min(devicePixelRatio||1,2); VW=innerWidth; VH=innerHeight; cv.width=VW*DPR; cv.height=VH*DPR; Z=Math.max(0.85,Math.min(1.6,Math.min(VW,VH)/520)); }

const joy={id:null,ox:0,oy:0,dx:0,dy:0};
const taps=new Map();
cv.addEventListener('pointerdown',e=>{
  if(!S.me || S.mode!=='village') return;
  cv.setPointerCapture(e.pointerId);
  if(e.pointerType!=='mouse' && e.clientX>VW*0.55 && joy.id===null){ joy.id=e.pointerId; joy.ox=e.clientX; joy.oy=e.clientY; joy.dx=joy.dy=0; return; }
  taps.set(e.pointerId,{x:e.clientX,y:e.clientY,t:performance.now()});
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId===joy.id){ let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy; const L=Math.hypot(dx,dy), R=55; if(L>R){ dx*=R/L; dy*=R/L; } joy.dx=dx/R; joy.dy=dy/R; }
});
const endPtr=e=>{
  if(e.pointerId===joy.id){ joy.id=null; joy.dx=joy.dy=0; return; }
  const t=taps.get(e.pointerId); taps.delete(e.pointerId);
  if(t && e.type==='pointerup' && Math.hypot(e.clientX-t.x,e.clientY-t.y)<12 && performance.now()-t.t<500) worldTap(e.clientX,e.clientY);

let camX=0,camY=0;
function worldTap(sx,sy){
  const wx=(sx/Z+camX)/T, wy=(sy/Z+camY)/T;
  const tx=Math.floor(wx), ty=Math.floor(wy);
  const near = (x,y,r)=>Math.hypot(S.x-x,S.y-y)<=r;
  const L=lotInfo();
  const ln=lotAtTile(tx,ty);
  if(ln>=0){
    const inf=L[ln];
    if(!inf){ near(tx+.5,ty+.5,7)?openLotSale(ln):toast('🏷️ Satılık arsa — yaklaş ve tabelaya dokun'); return; }
    if(inf.uid!==S.uid){ toast((inf.p.name||'?')+'\'in tarlası'); return; }
    const pp=plotFromTile(tx,ty);
    if(pp && pp.n===ln){
      if(!near(tx+.5,ty+.5,3.2)){ toast('Biraz daha yaklaş'); return; }
      actPlot(pp.n,pp.px,pp.py);
    }
    return;
  }
  if(tx>=MARKET.x&&tx<MARKET.x+MARKET.w&&ty>=MARKET.y-1&&ty<MARKET.y+MARKET.h){ near(MARKET.door.x,MARKET.door.y,5)?openShop():toast('Pazar\'a yürü 🛒'); return; }
  if(tx>=HANGAR.x&&tx<HANGAR.x+HANGAR.w&&ty>=HANGAR.y-1&&ty<HANGAR.y+HANGAR.h){ near(HANGAR.door.x,HANGAR.door.y,5)?openHangar():toast('Hangar\'a yürü ✈️'); return; }
}

function computeAction(){
  if(!S.me || S.mode!=='village') return null;
  const tx=Math.floor(S.x), ty=Math.floor(S.y);
  const ln=lotAtTile(tx,ty);
  if(ln>=0){
    const inf=lotInfo()[ln];
    if(!inf) return {label:'🏷️ Arsa: 💰'+fmtMoney(lotPrice(S.me.farms.length)),fn:()=>openLotSale(ln)};
    const pp=plotFromTile(tx,ty);
    if(inf.uid===S.uid && pp && pp.n===ln){
      const f=inf.farm;
      if(pp.px>=f.w||pp.py>=f.h) return {label:'🔒 Kapalı',fn:()=>actPlot(ln,pp.px,pp.py)};
      const pl=f.plots[pp.px+'_'+pp.py];
      if(!pl) return {label:'Ek '+CROPS[S.sel].em+' '+(S.me.seeds[S.sel]||0)+(S.useGubre?' 🧪':''),fn:()=>actPlot(ln,pp.px,pp.py)};
      const left=pl.t+cropDur(pl)-now();
      if(left<=0) return {label:'Hasat '+CROPS[pl.c].em,fn:()=>actPlot(ln,pp.px,pp.py)};
      return {label:'⏳ '+fmtTime(left),fn:()=>actPlot(ln,pp.px,pp.py)};
    }
  }
  if(Math.hypot(S.x-MARKET.door.x,S.y-MARKET.door.y)<2.6) return {label:'🛒 Pazar',fn:()=>openShop()};
  if(Math.hypot(S.x-HANGAR.door.x,S.y-HANGAR.door.y)<2.6) return {label:'✈️ Hangar',fn:openHangar};
  return null;
}

function blocked(x,y){ const r=0.28; for(const [ax,ay] of [[-r,-0.1],[r,-0.1],[-r,0.3],[r,0.3]]){ if(SOLID.has(getT(Math.floor(x+ax),Math.floor(y+ay)))) return true; } return false; }
function update(dt){
  let ix=0,iy=0;
  if(S.mode==='village'){
    if(keys['a']||keys['arrowleft']) ix--; if(keys['d']||keys['arrowright']) ix++;
    if(keys['w']||keys['arrowup']) iy--; if(keys['s']||keys['arrowdown']) iy++;
    if(joy.id!==null){ ix+=joy.dx; iy+=joy.dy; }
  }
  const L=Math.hypot(ix,iy);
  if(L>0.15 && !panel.classList.contains('on')){
    if(L>1){ ix/=L; iy/=L; }
    const sp=5.2*dt;
    const nx=S.x+ix*sp, ny=S.y+iy*sp;
    if(!blocked(nx,S.y)) S.x=nx;
    if(!blocked(S.x,ny)) S.y=ny;
    S.dir = Math.abs(ix)>Math.abs(iy) ? (ix>0?1:3) : (iy>0?0:2);
    S.moving=true;
  } else S.moving=false;
  sendPresence(false);
  const k=1-Math.pow(0.0005,dt);
  for(const [id,o] of S.others){ o.x+=(o.tx-o.x)*k; o.y+=(o.ty-o.y)*k; if(Math.hypot(o.tx-o.x,o.ty-o.y)>6){o.x=o.tx;o.y=o.ty;} }
  for(let i=fx.length-1;i>=0;i--){ const f=fx[i]; f.life-=dt; f.x+=f.vx*dt; f.y+=f.vy*dt; if(!f.txt) f.vy+=160*dt; if(f.life<=0) fx.splice(i,1); }
}

    const fi=(x-XMIN)/C, fj=(z-ZMIN)/C; if(fi<0||fj<0||fi>=NX||fj>=NZ) return 0;
    const i=Math.floor(fi), j=Math.floor(fj), fx=fi-i, fz=fj-j;
    const hA=H[j*(NX+1)+i], hB=H[j*(NX+1)+i+1], hD=H[(j+1)*(NX+1)+i], hC=H[(j+1)*(NX+1)+i+1];
    if(fx+fz<=1) return hA+(hB-hA)*fx+(hD-hA)*fz;
    return hC+(hD-hC)*(1-fx)+(hB-hC)*(1-fz);
  };
  W.isWater=(x,z)=>coastal && W.heightAt(x,z)<-0.5;
  // arazi meshi
  const FIELDS=['#86b84f','#9fc45c','#c8b55c','#73a845','#a88b55','#93c060','#b9c46a','#6f9e44'].map(hexRGB);
  const mb=new MB();
  for(let j=0;j<NZ;j++) for(let i=0;i<NX;i++){
    const x0=XMIN+i*C, x1=x0+C, z0=ZMIN+j*C, z1=z0+C;
    const A=[x0,H[j*(NX+1)+i],z0], B=[x1,H[j*(NX+1)+i+1],z0], Dp=[x0,H[(j+1)*(NX+1)+i],z1], Cp=[x1,H[(j+1)*(NX+1)+i+1],z1];
    const cx=(x0+x1)/2, cz=(z0+z1)/2, hm=(A[1]+B[1]+Cp[1]+Dp[1])/4;
    let col;
    if(hm<-0.5) col=hexRGB('#c9b98a');
    else if(hm>380) col=hexRGB(fhash(i,j,seed)<0.5?'#8b8578':'#9a9384');
    else if(hm>110) col=hexRGB(fhash(i,j,seed+1)<0.6?'#3f7a3c':'#4c8843');
    else { const fi=Math.floor(fhash(Math.floor(cx/420),Math.floor(cz/360),seed+3)*FIELDS.length); col=FIELDS[fi]; }
    const sh=0.94+fhash(i,j,seed+9)*0.1; col=col.map(v=>v*sh);
    mb.tri(Dp,Cp,B,col); mb.tri(Dp,B,A,col);
  }
  W.terrain=mb.upload(gl);
  // uzak zemin + deniz
  const far=new MB(); const g=hexRGB('#7fae55'); const Z=60000;
  far.quad([-Z,-3,Z],[Z,-3,Z],[Z,-3,-Z],[-Z,-3,-Z],g); W.far=far.upload(gl);
  if(coastal){ const sea=new MB(); const b=hexRGB('#2f74b5'); sea.quad([coastX-800,0,Z],[Z,0,Z],[Z,0,-Z],[coastX-800,0,-Z],b); W.sea=sea.upload(gl); }
  // pistler, işaretler, binalar, ağaçlar
  const rw=new MB(), mk=new MB(), bl=new MB(), tr=new MB();
  const asph=hexRGB('#4a4e54'), white=[0.95,0.95,0.95], yellow=hexRGB('#f2c230');
  for(const ap of [o,d]){
    const w=ap.wid/2;
    rw.quadUp(ap.at(-60,-w,0.05),ap.at(ap.len+60,-w,0.05),ap.at(ap.len+60,w,0.05),ap.at(-60,w,0.05),asph);
    // eşik çizgileri

      mk.quadUp(ap.at(a0,b-0.9,0.05),ap.at(a1,b-0.9,0.05),ap.at(a1,b+0.9,0.05),ap.at(a0,b+0.9,0.05),white);

    for(const a of [150,ap.len-200]) for(const s of [-1,1]) mk.quadUp(ap.at(a,s*w*0.45-2,0.05),ap.at(a+45,s*w*0.45-2,0.05),ap.at(a+45,s*w*0.45+2,0.05),ap.at(a,s*w*0.45+2,0.05),white);
    // kenar çizgileri
    for(const s of [-1,1]) mk.quadUp(ap.at(0,s*w-0.4,0.05),ap.at(ap.len,s*w-0.4,0.05),ap.at(ap.len,s*w+0.4,0.05),ap.at(0,s*w+0.4,0.05),white);
    // apron + bina
    const ey=[0,1,0], ez=vscl(ap.u,-1);
    const apronB = w+70;
    rw.quadUp(ap.at(ap.len*0.3,apronB-30,0.05),ap.at(ap.len*0.6,apronB-30,0.05),ap.at(ap.len*0.6,apronB+60,0.05),ap.at(ap.len*0.3,apronB+60,0.05),hexRGB('#62666c'));
    mk.quadUp(ap.at(ap.len*0.3,w,0.05),ap.at(ap.len*0.3+20,w,0.05),ap.at(ap.len*0.3+20,apronB-30,0.05),ap.at(ap.len*0.3,apronB-30,0.05),hexRGB('#62666c'));
    bl.boxB(onG(ap.at(ap.len*0.42,apronB+85)),ap.r,ey,ez,50,14,60,hexRGB('#9aa4ad'));
    bl.boxB(onG(ap.at(ap.len*0.52,apronB+75)),ap.r,ey,ez,14,22,14,hexRGB('#e8e2d3')); // kule
    bl.boxB(ap.at(ap.len*0.52,apronB+75,22),ap.r,ey,ez,16,5,16,hexRGB('#3c5a72'));
    // rüzgâr tulumu direği
    bl.boxB(ap.at(250,-w-25),ap.r,ey,ez,0.4,8,0.4,[0.85,0.85,0.85]);
    if(ap.kind==='koy'){
      for(let k=0;k<26;k++){
        const a=fhash(k,1,seed)*ap.len*1.2-100, b=-(w+120+fhash(k,2,seed)*450);
        const c=onG(ap.at(a,b)), sx=8+fhash(k,3,seed)*6, sz=9+fhash(k,4,seed)*6, hgt=4+fhash(k,5,seed)*3;
        bl.boxB(c,ap.r,ey,ez,sx,hgt,sz,hexRGB(['#f1e4c8','#e9d3b0','#f4efe4','#e4cfa8'][k%4]));
        // çatı (üçgen prizma)
        const roof=hexRGB(['#b5442f','#c9562e','#a33d2c'][k%3]);
        const P=(x,y,z)=>vadd(vadd(vadd(c,vscl(ap.r,x)),[0,y,0]),vscl(ez,z));
        const yb=hgt, yt=hgt+4; const hx=sx/2+0.6, hz=sz/2+0.6;
        bl.triO(P(-hx,yb,-hz),P(hx,yb,-hz),P(hx,yt,0),roof,vsub(P(0,yt,-hz),P(0,yb,0)));
        bl.triO(P(-hx,yb,-hz),P(hx,yt,0),P(-hx,yt,0),roof,vsub(P(0,yt,-hz),P(0,yb,0)));
        bl.triO(P(-hx,yb,hz),P(hx,yt,0),P(hx,yb,hz),roof,vsub(P(0,yt,hz),P(0,yb,0)));
        bl.triO(P(-hx,yb,hz),P(-hx,yt,0),P(hx,yt,0),roof,vsub(P(0,yt,hz),P(0,yb,0)));
        bl.triO(P(-hx,yb,-hz),P(-hx,yt,0),P(-hx,yb,hz),roof,ap.r.map(v=>-v));
        bl.triO(P(hx,yb,-hz),P(hx,yb,hz),P(hx,yt,0),roof,ap.r);
      }
    } else {
      const big = name==='Ankara'?1.6:1;
      for(let gx=0;gx<9;gx++) for(let gz=0;gz<7;gz++){
        if(fhash(gx,gz,seed+7)<0.15) continue;
        const a=-300+gx*230+fhash(gx,gz,seed)*60, b=w+260+gz*170;
        const hgt=(10+Math.pow(fhash(gx,gz,seed+2),2.2)*70*big)*(gz<2?0.6:1);
        const cc=hexRGB(['#d9d4c7','#c7c2b8','#e3dccd','#b8b4ad','#cfc6b4','#9fb0bf'][(gx*3+gz)%6]);
        bl.boxB(onG(ap.at(a,b)),ap.r,ey,ez,40+fhash(gx,gz,seed+4)*40,hgt,40+fhash(gx,gz,seed+5)*50,cc);
        if(hgt>45) bl.boxB(vadd(onG(ap.at(a,b)),[0,hgt,0]),ap.r,ey,ez,12,3,12,[0.4,0.4,0.42]);
      }
    }
  }
  // ağaçlar
  let placed=0;
  for(let k=0;k<6000 && placed<1300;k++){
    const x=XMIN+fhash(k,11,seed)*(XMAX-XMIN), z=ZMIN+fhash(k,12,seed)*(ZMAX-ZMIN);
    const h=W.heightAt(x,z); if(h<0.5||h>360) continue;
    let near=false; for(const ap of [o,d]){ const l=rwyLocal(ap,x,z); if(l.a>-250&&l.a<ap.len+250&&Math.abs(l.b)<ap.wid/2+180) near=true; if(ap.kind!=='koy'){ if(l.a>-400&&l.a<ap.len+300&&l.b>0&&l.b<1500) near=true; } }
    if(near) continue;
    if(h<100 && fhash(Math.floor(x/420),Math.floor(z/360),seed+21)>0.35) continue; // tarlalar açık kalsın
    const th=7+fhash(k,13,seed)*9, rr=2.5+fhash(k,14,seed)*1.8, col=hexRGB(fhash(k,15,seed)<0.5?'#2f6b34':'#3b7d3c');
    const base=[]; for(let s=0;s<5;s++){ const an=s/5*Math.PI*2; base.push([x+Math.cos(an)*rr,h+1.5,z+Math.sin(an)*rr]); }
    const apex=[x,h+th,z];
    for(let s=0;s<5;s++){ const a=base[s],b=base[(s+1)%5]; tr.triO(a,b,apex,col,[(a[0]+b[0])/2-x,0.3,(a[2]+b[2])/2-z]); }
    tr.box(x,h+0.75,z,0.6,1.5,0.6,hexRGB('#6b4a2b'));
    placed++;
  }
  W.runway=rw.upload(gl); W.marks=mk.upload(gl); W.bld=bl.upload(gl); W.trees=tr.upload(gl);
  // bulutlar
  const cl=new MB(), cw=[0.97,0.98,1];
  for(let k=0;k<70;k++){
    const x=XMIN+fhash(k,31,seed)*(XMAX-XMIN)*1.4-4000, z=ZMIN+fhash(k,32,seed)*(ZMAX-ZMIN), y=900+fhash(k,33,seed)*700;
    for(let p=0;p<4;p++){
      const cx=x+(fhash(k,40+p,seed)-0.5)*500, cz=z+(fhash(k,50+p,seed)-0.5)*300, cy=y+(fhash(k,60+p,seed))*60;
      const rx=120+fhash(k,70+p,seed)*160, ry=40+fhash(k,80+p,seed)*40, rz=90+fhash(k,90+p,seed)*120;
      const V=[[cx+rx,cy,cz],[cx-rx,cy,cz],[cx,cy+ry,cz],[cx,cy-ry*0.4,cz],[cx,cy,cz+rz],[cx,cy,cz-rz]];
      const F=[[0,2,4],[4,2,1],[1,2,5],[5,2,0],[0,4,3],[4,1,3],[1,5,3],[5,0,3]];
      for(const f of F){ const a=V[f[0]],b=V[f[1]],c=V[f[2]]; cl.triO(a,b,c,cw,vsub(vscl(vadd(vadd(a,b),c),1/3),[cx,cy,cz])); }
    }
  }
  W.clouds=cl.upload(gl);
  // yaklaşma halkaları (3°)
  const rg=new MB(), rc=hexRGB('#3fd6ff');
  for(let s=500;s<=APP_GATE+500;s+=500){
    const c=d.at(-s,0,15+s*Math.tan(3*D2R)), R1=22, R2=26;
    for(let k=0;k<16;k++){
      const a0=k/16*Math.PI*2, a1=(k+1)/16*Math.PI*2;
      const P=(r,a)=>vadd(c, vadd(vscl(d.r,Math.cos(a)*r),[0,Math.sin(a)*r,0]));
      rg.quad(P(R1,a0),P(R2,a0),P(R2,a1),P(R1,a1),rc);
    }
  }
  W.rings=rg.upload(gl);
  // PAPI kutusu ve gölge, rüzgâr tulumu
  const pb=new MB(); pb.box(0,0.6,0,2.2,1.2,1.4,[1,1,1]); W.papiBox=pb.upload(gl);
  W.papiPos=[0,1,2,3].map(i=>d.at(300,-(d.wid/2+12+i*9),0));
  const sd=new MB(); sd.quad([-0.5,0,0.5],[0.5,0,0.5],[0.5,0,-0.5],[-0.5,0,-0.5],[0,0,0]); W.shadow=sd.upload(gl);
  const ws=new MB(); ws.box(0,0,1.8,1.0,1.0,3.6,hexRGB('#f07a26')); W.sock=ws.upload(gl);
  // gökyüzü kubbesi
  const sk=new MB(), zen=hexRGB('#3c7fd4'), hor=hexRGB('#d3e6f5');
  const SR=20000, rings=10, segs=24;
  for(let i=0;i<rings;i++){
    const e0=(-0.15+i/rings*1.15)*Math.PI/2, e1=(-0.15+(i+1)/rings*1.15)*Math.PI/2;
    const c0=hor.map((h,k)=>lerp(h,zen[k],Math.pow(clamp(Math.sin(e0),0,1),0.6))), c1=hor.map((h,k)=>lerp(h,zen[k],Math.pow(clamp(Math.sin(e1),0,1),0.6)));
    for(let s=0;s<segs;s++){
      const a0=s/segs*Math.PI*2, a1=(s+1)/segs*Math.PI*2;
      const P=(e,a)=>[Math.cos(e)*Math.cos(a)*SR, Math.sin(e)*SR, Math.cos(e)*Math.sin(a)*SR];
      // renk köşe başına değil yüz başına (basit) — iki üçgene farklı renk
      sk.tri(P(e0,a0),P(e1,a0),P(e1,a1),c1); sk.tri(P(e0,a0),P(e1,a1),P(e0,a1),c0);
    }
  }
  W.sky=sk.upload(gl); W.fogC=hor;
  return W;
}

/* ---------- uçak modelleri ---------- */
function buildPlane(R,model,colorHex){
  const b=new MB(), p=new MB(), c=hexRGB(colorHex), wh=hexRGB('#f2efe6'), gl_=hexRGB('#4d6f8c'), dk=hexRGB('#2b2b2e'), gr=hexRGB('#9a9ea4');
  let props, span;
  if(model==='kingair'){
    b.box(0,0.3,-0.6,1.7,1.9,8.6,wh); b.box(0,0.1,-5.4,1.3,1.4,1.6,wh); b.box(0,0.0,-6.4,0.8,0.8,0.8,wh);
    b.box(0,0.9,-4.4,1.5,0.55,0.9,gl_); b.box(0,0.65,-1.2,1.72,0.4,5.5,gl_);
    b.box(0,0.6,4.5,1.1,1.3,3.2,wh); b.box(0,-0.15,-0.6,1.74,0.25,12.6,c);
    b.box(0,-0.35,-0.8,16.6,0.25,2.3,wh); for(const s of [-1,1]) b.box(s*8.1,-0.35,-0.8,0.5,0.27,2.3,c);
    for(const s of [-1,1]){ b.box(s*2.7,-0.15,-1.7,0.9,0.9,3.4,wh); b.box(s*2.7,-0.15,-3.45,0.5,0.5,0.3,c); b.box(s*2.7,-1.05,-1.2,0.15,1.1,0.15,gr); b.box(s*2.7,-1.55,-1.2,0.25,0.4,0.6,dk); }
    b.box(0,2.1,5.2,0.14,2.8,1.7,c); b.box(0,3.45,5.7,5.4,0.14,1.1,wh); b.box(0,-1.0,-4.6,0.15,1.0,0.15,gr); b.box(0,-1.55,-4.6,0.2,0.4,0.5,dk);
    props=[[-2.7,-0.15,-3.65],[2.7,-0.15,-3.65]]; span=16.6;
    p.box(0,0,0,0.18,2.5,0.06,dk); p.box(0,0,0,2.5,0.18,0.06,dk);
  } else {
    const k = model==='c172'?1.08:1;
    const B=(x,y,z,sx,sy,sz,col)=>b.box(x*k,y*k,z*k,sx*k,sy*k,sz*k,col);
    B(0,0.1,-2.9,1.0,1.0,1.4,wh); B(0,0.1,-3.65,0.4,0.4,0.25,c);
    B(0,0.25,-1.4,1.1,1.35,1.8,wh); B(0,0.72,-2.2,1.0,0.5,0.35,gl_); B(0,0.55,-1.35,1.12,0.42,1.5,gl_);
    B(0,0.2,0.9,0.8,0.95,2.8,wh); B(0,0.35,2.6,0.45,0.6,1.0,wh);
    B(0,-0.12,-1.4,1.13,0.16,1.8,c); B(0,-0.05,0.9,0.82,0.16,2.8,c);
    B(0,1.0,-1.4,10.2,0.14,1.5,wh); for(const s of [-1,1]){ B(s*4.95,1.0,-1.4,0.3,0.16,1.5,c); B(s*1.7,0.35,-1.35,0.08,1.25,0.12,gr); }
    B(0,0.35,3.0,3.4,0.1,0.9,wh); B(0,1.1,3.0,0.1,1.5,1.1,c);
    for(const s of [-1,1]){ B(s*1.1,-0.7,-1.0,0.1,0.7,0.1,gr); B(s*1.15,-1.0,-1.0,0.2,0.4,0.42,dk); }
    B(0,-0.65,-2.9,0.1,0.7,0.1,gr); B(0,-0.98,-2.9,0.16,0.4,0.4,dk);
    props=[[0,0.1*k,-3.8*k]]; span=10.2*k;
    p.box(0,0,0,0.13,1.9*k,0.06,dk);
  }
  return {body:b.upload(R.gl), prop:p.upload(R.gl), props, span};
}

/* ---------- ses ---------- */
function makeAudio(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const master=ac.createGain(); master.gain.value=FLSET.sound?0.5:0; master.connect(ac.destination);
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; lp.connect(master);
    const eg=ac.createGain(); eg.gain.value=0; eg.connect(lp);
    const o1=ac.createOscillator(); o1.type='sawtooth'; o1.frequency.value=40; o1.connect(eg); o1.start();
    const o2=ac.createOscillator(); o2.type='square'; o2.frequency.value=80; const g2=ac.createGain(); g2.gain.value=0.25; o2.connect(g2); g2.connect(eg); o2.start();
    const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    const ns=ac.createBufferSource(); ns.buffer=nb; ns.loop=true; const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=0.6;
    const ng=ac.createGain(); ng.gain.value=0; ns.connect(bp); bp.connect(ng); ng.connect(master); ns.start();
    const ho=ac.createOscillator(); ho.type='square'; ho.frequency.value=1500; const hg=ac.createGain(); hg.gain.value=0; ho.connect(hg); hg.connect(master); ho.start();
    return {ac,master,o1,o2,eg,ng,hg,
      set(rpm,v,horn,t){ const now=ac.currentTime; o1.frequency.setTargetAtTime(28+rpm*62,now,0.05); o2.frequency.setTargetAtTime(56+rpm*124,now,0.05);
        eg.gain.setTargetAtTime(rpm>0.02?0.10+rpm*0.16:0,now,0.08); ng.gain.setTargetAtTime(Math.min(0.35,(v/70)*(v/70)*0.3),now,0.1);
        hg.gain.setTargetAtTime(horn&&(t*4%1<0.5)?0.05:0,now,0.01); },
      thump(str){ const now=ac.currentTime, o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(90,now); o.frequency.exponentialRampToValueAtTime(30,now+0.3); g.gain.setValueAtTime(Math.min(0.8,str),now); g.gain.exponentialRampToValueAtTime(0.001,now+0.4); o.connect(g); g.connect(master); o.start(); o.stop(now+0.45); },
      mute(m){ master.gain.value=m?0:0.5; },
      close(){ try{ ac.close(); }catch(e){} } };
  }catch(e){ return null; }
}
