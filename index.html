/* ---------- ses ---------- */
/* Motor sesi: gerçek motor fiziğine göre sentezlenir.
   Pistonlu (Cessna): 4 silindirin her ateşlemesi kısa bir "patlama" (düşük frekanslı darbe + gürültü),
   silindirler arası küçük dengesizlik → karakteristik "tok tok" ritmi; pervane kanat geçişi genlik modülasyonu.
   Turboprop (King Air): türbin ıslığı + kompresör hışırtısı + 4 kanatlı pervane vızıltısı.
   Gerçek kayıtlar yüklendiyse (SFX.engine/idle) motor sesi onlardan üretilir; yoksa sentez kullanılır. */
function makeAudio(model, ctxOverride){
  try{
    const ac=ctxOverride || new (window.AudioContext||window.webkitAudioContext)();
    const sr=ac.sampleRate, turbo = model==='kingair';
    const VOL=0.7;
    const master=ac.createGain(); master.gain.value=FLSET.sound?VOL:0;
    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-18; comp.ratio.value=4;
    master.connect(comp); comp.connect(ac.destination);
    const noiseBuf=(()=>{ const b=ac.createBuffer(1,sr*2,sr), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return b; })();
    const loopSrc=(buf)=>{ const s=ac.createBufferSource(); s.buffer=buf; s.loop=true; s.start(); return s; };
    const filt=(type,f,q=0.7)=>{ const x=ac.createBiquadFilter(); x.type=type; x.frequency.value=f; x.Q.value=q; return x; };
    const gainN=v=>{ const g=ac.createGain(); g.gain.value=v; return g; };
    const shaper=(()=>{ const w=ac.createWaveShaper(), c=new Float32Array(1024); for(let i=0;i<1024;i++){ const x=i/511.5-1; c[i]=Math.tanh(x*2.2); } w.curve=c; return w; })();

    // --- motor katmanı ---
    const engBus=gainN(0); const engLP=filt('lowpass',800,0.9);
    engBus.connect(shaper); shaper.connect(engLP);
    // pervane kanat geçişi: genlik modülasyonu
    const propAM=gainN(0.75); engLP.connect(propAM); propAM.connect(master);
    const lfo=ac.createOscillator(); lfo.frequency.value=30; const lfoDepth=gainN(0.25); lfo.connect(lfoDepth); lfoDepth.connect(propAM.gain); lfo.start();
    let pist=null, pistLow=null, turb=null;
    const F0=25; // playbackRate 1'de ateşleme frekansı (Hz) ≈ 750 rpm
    let real=null;
    if(SFX.engine && SFX.idle){
      // gerçek kayıt: rölanti ve tam güç döngüleri arasında devire göre geçiş
      const mk=(buf)=>{ const s=ac.createBufferSource(); s.buffer=buf; s.loop=true; s.loopStart=0.08; s.loopEnd=buf.duration-0.08; const g=gainN(0); s.connect(g); s.start(0,0.08+Math.random()*2); return {s,g}; };
      const idle=mk(SFX.idle), full=mk(SFX.engine);
      const rbus=gainN(0); idle.g.connect(rbus); full.g.connect(rbus);
      const rlp=filt('lowpass',turbo?2600:5200,0.6); rbus.connect(rlp); rlp.connect(master);
      real={idle,full,rbus,rlp};
    }
    if(!turbo && !real){
      let buf;
      {
        buf=ac.createBuffer(1,sr*2,sr); const d=buf.getChannelData(0);
        const period=sr/F0, cyl=[1,0.82,0.94,0.78]; let t=0,k=0;
        while(t<d.length){
          const amp=cyl[k%4]*(0.85+Math.random()*0.3), tone=48+Math.random()*14, dur=Math.min(period*1.6,sr*0.09);
          for(let i=0;i<dur && t+i<d.length;i++){
            const x=i/sr, env=Math.exp(-x*70)*(1-Math.exp(-x*900));
            d[t+i]+= amp*env*(Math.sin(2*Math.PI*tone*x)*0.85 + Math.sin(2*Math.PI*tone*2.3*x)*0.25 + (Math.random()*2-1)*0.55);
          }
          t+=Math.round(period*(0.985+Math.random()*0.03)); k++;
        }
        let mx=0; for(const v of d) mx=Math.max(mx,Math.abs(v)); for(let i=0;i<d.length;i++) d[i]/=mx;
        // döngü sınırında tıkırtı olmasın
        for(let i=0;i<256;i++){ d[i]*=i/256; d[d.length-1-i]*=i/256; }
      }
      pist=loopSrc(buf); pist.connect(engBus);
      pistLow=loopSrc(buf); const lowLP=filt('lowpass',140,0.8), lowG=gainN(0.9); pistLow.connect(lowLP); lowLP.connect(lowG); lowG.connect(engBus);
    }
    if(turbo){
      // türbin ıslığı
      const w1=ac.createOscillator(); w1.type='sine'; w1.frequency.value=2400; const w2=ac.createOscillator(); w2.type='triangle'; w2.frequency.value=3650;
      const wg=gainN(0.0); w1.connect(wg); w2.connect(wg); w1.start(); w2.start();
      const hiss=loopSrc(noiseBuf); const hbp=filt('bandpass',1800,0.9); const hg=gainN(0); hiss.connect(hbp); hbp.connect(hg);
      // pervane vızıltısı (testere dişi → alçak geçiren)
      const buzz=ac.createOscillator(); buzz.type='sawtooth'; buzz.frequency.value=100; const bz=filt('lowpass',500,1.2), bg=gainN(0.5); buzz.connect(bz); bz.connect(bg); bg.connect(engBus); buzz.start();
      const roar=loopSrc(noiseBuf); const rlp=filt('lowpass',260,0.7), rg=gainN(0.6); roar.connect(rlp); rlp.connect(rg); rg.connect(engBus);
      wg.connect(master); hg.connect(master);
      turb={w1,w2,wg,hg,buzz,hbp};
    }
    // --- rüzgâr ---
    const wind=loopSrc(noiseBuf); const wbp=filt('bandpass',650,0.5), wG=gainN(0); wind.connect(wbp); wbp.connect(wG); wG.connect(master);
    const wind2=loopSrc(noiseBuf); const whp=filt('highpass',2500,0.5), w2G=gainN(0); wind2.connect(whp); whp.connect(w2G); w2G.connect(master);
    // --- stall uyarısı (dil düdüğü) ---
    const horn=ac.createOscillator(); horn.type='sawtooth'; horn.frequency.value=1650; const hornBP=filt('bandpass',1650,6), hornG=gainN(0); horn.connect(hornBP); hornBP.connect(hornG); hornG.connect(master); horn.start();
    let lastMis=0;
    const A={ac,
      set(rpm,v,stall,t,rough){
        const now=ac.currentTime;
        const on = rpm>0.02;
        if(real){
          const r=rpm, pm=turbo?1.3:1;
          const idleW=clamp(1-(r-0.22)/0.38,0,1), fullW=clamp((r-0.28)/0.42,0,1);
          real.idle.s.playbackRate.setTargetAtTime((0.92+(r-0.22)*0.7)*pm,now,0.08);
          real.full.s.playbackRate.setTargetAtTime((0.74+r*0.4)*pm,now,0.08);
          real.idle.g.gain.setTargetAtTime(idleW,now,0.12); real.full.g.gain.setTargetAtTime(fullW*0.8,now,0.12);
          const base=on?(turbo?0.4:0.95):0;
          if(rough && on && now-lastMis>0.12 && Math.random()<0.18){ lastMis=now; real.rbus.gain.cancelScheduledValues(now); real.rbus.gain.setValueAtTime(base*0.25,now); real.rbus.gain.setTargetAtTime(base,now+0.07,0.03); }
          else real.rbus.gain.setTargetAtTime(base,now,on?0.1:0.25);
        }
        if(!turbo && pist){
          const rate=0.75+rpm*2.6;  // ~560 → 2500 rpm
          pist.playbackRate.setTargetAtTime(rate,now,0.06); pistLow.playbackRate.setTargetAtTime(rate*0.5,now,0.06);
          engLP.frequency.setTargetAtTime(380+rpm*2600,now,0.08);
          engBus.gain.setTargetAtTime(on?0.18+rpm*0.55:0,now,0.08);
          const realRpm=560+rpm*1940; lfo.frequency.setTargetAtTime(realRpm/60*2,now,0.06); lfoDepth.gain.setTargetAtTime(0.12+rpm*0.2,now,0.1);
          if(rough && on && now-lastMis>0.12 && Math.random()<0.18){ lastMis=now; engBus.gain.cancelScheduledValues(now); engBus.gain.setValueAtTime(0.05,now); engBus.gain.setTargetAtTime(0.18+rpm*0.55,now+0.07,0.03); }
        } else if(turb){
          const n=on?0.55+rpm*0.45:Math.min(0.3,v/150);
          turb.w1.frequency.setTargetAtTime(1400+n*1700,now,0.4); turb.w2.frequency.setTargetAtTime(2100+n*2600,now,0.4);
          turb.wg.gain.setTargetAtTime(on?0.015+n*0.03:0.004,now,0.4); turb.hg.gain.setTargetAtTime(on?0.03+n*0.07:0,now,0.3);
          turb.hbp.frequency.setTargetAtTime(1200+n*1500,now,0.3);
          turb.buzz.frequency.setTargetAtTime((1100+rpm*900)/60*4,now,0.2);
          engBus.gain.setTargetAtTime(on?0.12+rpm*0.4:0,now,0.15); engLP.frequency.setTargetAtTime(600+rpm*1500,now,0.1);
          lfo.frequency.setTargetAtTime((1100+rpm*900)/60*4,now,0.2); lfoDepth.gain.setTargetAtTime(0.15,now,0.2);
        }
        const q=(v/60)*(v/60);
        wG.gain.setTargetAtTime(Math.min(0.3,q*0.12),now,0.15); w2G.gain.setTargetAtTime(Math.min(0.04,q*0.012),now,0.15);
        hornG.gain.setTargetAtTime(stall?0.06:0,now,0.02);
      },
      thump(str){ const now=ac.currentTime, o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(85,now); o.frequency.exponentialRampToValueAtTime(28,now+0.3); g.gain.setValueAtTime(Math.min(0.9,0.2+str),now); g.gain.exponentialRampToValueAtTime(0.001,now+0.4); o.connect(g); g.connect(master); o.start(); o.stop(now+0.45); },
      screech(str){ const now=ac.currentTime, s=ac.createBufferSource(); s.buffer=noiseBuf; const bp=filt('bandpass',2800,3), g=gainN(0); s.connect(bp); bp.connect(g); g.connect(master);
        g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(Math.min(0.35,0.1+str*0.25),now+0.02); g.gain.exponentialRampToValueAtTime(0.001,now+0.35); s.start(now); s.stop(now+0.4); },
      oneShot(name,vol=0.8){ const b=SFX[name]; if(!b) return; const s=ac.createBufferSource(); s.buffer=b; if(turbo) s.playbackRate.value=1.25; const g=gainN(vol); s.connect(g); g.connect(master); s.start(); },
      mute(m){ master.gain.value=m?0:VOL; },
      close(){ try{ ac.close(); }catch(e){} } };
    return A;
  }catch(e){ console.warn(e); return null; }
}

/* ---------- uydu görüntüsü (USGS/USDA NAIP — kamu malı) ---------- */
// Konumu önemli değil: ABD'de bir tarım bölgesi (Lancaster, Pensilvanya) "temel tarla" olarak kullanılır.
const SAT={state:'idle', canvas:null, z:13, x0:2359, y0:3096, n:8, size:30000};
function preloadSat(){
  if(SAT.state!=='idle') return; SAT.state='loading';
  const N=SAT.n, TS=256, cv=document.createElement('canvas'); cv.width=cv.height=N*TS; const cx=cv.getContext('2d');
  cx.fillStyle='#7aa356'; cx.fillRect(0,0,cv.width,cv.height);
  let done=0, ok=0; const total=N*N;
  const fin=()=>{ if(++done<total) return; SAT.state = ok>=total*0.7 ? 'ok' : 'fail'; if(SAT.state==='ok'){ try{ cx.getImageData(0,0,1,1); }catch(e){ SAT.state='fail'; } } SAT.canvas=cv; };
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const im=new Image(); im.crossOrigin='anonymous';
    im.onload=()=>{ try{ cx.drawImage(im,i*TS,j*TS); ok++; }catch(e){} fin(); };
    im.onerror=fin;
    im.src=`https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/${SAT.z}/${SAT.y0+j}/${SAT.x0+i}`;
  }
  setTimeout(()=>{ if(SAT.state==='loading'){ SAT.state = ok>=total*0.7?'ok':'fail'; SAT.canvas=cv; } }, 20000);
}
function satTexture(gl){
  if(SAT.state!=='ok' || !SAT.canvas) return null;
  try{
    const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,SAT.canvas);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    const an=gl.getExtension('EXT_texture_filter_anisotropic'); if(an) gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
    return t;
  }catch(e){ SAT.state='fail'; return null; }
}

const PIT={ok:false, img:null, W:1919, H:1079, hy:612, fx:965,

function drawPitInstruments(c,L,st,P,ktV,altFt,vs,turn){

  { const [x,y,r]=at('asi'); base(x,y,r); const A=k=>-Math.PI/2+(k/180)*Math.PI*1.75+0.25;

    c.fillStyle='#3d8fd6'; c.fillRect(-r*2,-r*2+po,r*4,r*2); c.fillStyle='#7a4e2a'; c.fillRect(-r*2,po,r*4,r*2);
    c.strokeStyle='#fff'; c.lineWidth=1.5; c.beginPath(); c.moveTo(-r*2,po); c.lineTo(r*2,po); c.stroke();

    c.strokeStyle='#ff8a1e'; c.lineWidth=Math.max(2,r*0.07); c.beginPath(); c.moveTo(x-r*0.55,y); c.lineTo(x-r*0.15,y); c.lineTo(x,y+r*0.1); c.lineTo(x+r*0.15,y); c.lineTo(x+r*0.55,y); c.stroke(); }
  // altimetre
  { const [x,y,r]=at('alt'); base(x,y,r); for(let i=0;i<50;i++) tick(x,y,r,-Math.PI/2+i/50*Math.PI*2,i%5?0.07:0.15,1.2); for(let i=0;i<10;i++) txt(x,y,r,-Math.PI/2+i/10*Math.PI*2,i,0.24);

  // yön göstergesi
  { const [x,y,r]=at('dg'); base(x,y,r); const hdg=((st.psi/D2R)%360+360)%360;
    for(let d=0;d<360;d+=10){ const a=-Math.PI/2+(d-hdg)*D2R; tick(x,y,r,a,d%30?0.08:0.15,1.2); if(d%30===0) txt(x,y,r,a,({0:'N',90:'E',180:'S',270:'W'})[d]||String(d/10),0.2); }
    c.fillStyle='#ff8a1e'; c.beginPath(); c.moveTo(x,y-r*0.95); c.lineTo(x-r*0.08,y-r*0.78); c.lineTo(x+r*0.08,y-r*0.78); c.fill();
    c.strokeStyle='#ff8a1e'; c.lineWidth=Math.max(1.5,r*0.05); c.beginPath(); c.moveTo(x,y-r*0.3); c.lineTo(x,y+r*0.3); c.moveTo(x-r*0.25,y-r*0.05); c.lineTo(x+r*0.25,y-r*0.05); c.moveTo(x-r*0.1,y+r*0.25); c.lineTo(x+r*0.1,y+r*0.25); c.stroke(); }
  // dikey hız
  { const [x,y,r]=at('vsi'); base(x,y,r); const A=v=>Math.PI+clamp(v/2000,-1,1)*Math.PI*0.94;
    for(let v=-2000;v<=2000;v+=500) tick(x,y,r,A(v),v%1000?0.08:0.16,1.4); for(const v of [-2000,-1000,0,1000,2000]) txt(x,y,r,A(v),Math.abs(v/100),0.22);
    ndl(x,y,r,A(vs),0.8,Math.max(1.5,r*0.06)); }
  // devir
  { const [x,y,r]=at('rpm'); base(x,y,r); const A=v=>Math.PI*2/3+clamp(v/3500,0,1)*Math.PI*1.55;
    arc(x,y,r*0.93,A(2100),A(2700),'#2fae4a',r*0.09); tick(x,y,r,A(2700),0.22,2,'#e33');
    for(let v=0;v<=3500;v+=500) { tick(x,y,r,A(v),0.14,1.4); txt(x,y,r,A(v),v/100,0.2); }
    ndl(x,y,r,A(st.rpm*2650),0.8,Math.max(1.5,r*0.06)); }
  c.restore();
}

/* ---------- tam ekran + klavye kilidi ---------- */
function enterFlightFullscreen(force){
  if(!FLSET.fs && !force) return;
  const de=document.documentElement;
  try{
    if(!document.fullscreenElement && de.requestFullscreen){
      de.requestFullscreen({navigationUI:'hide'}).then(()=>{
        // Chrome: tam ekranda Ctrl+W, Ctrl+T, Ctrl+N gibi tuşlar oyuna gelir, sekme kapanmaz
        if(navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(()=>{});
      }).catch(()=>{});
    }
  }catch(e){}
}
function exitFlightFullscreen(){
  try{ if(navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); }catch(e){}
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }catch(e){}
}

/* ---------- ana uçuş fonksiyonu ---------- */
function startFlight(opts){
  enterFlightFullscreen();
  return new Promise(resolve=>{
    const el=flightDOM(); el.classList.add('on');
    { const old=document.getElementById('flGL'); const nc=document.createElement('canvas'); nc.id='flGL'; old.replaceWith(nc); }
    const glc=document.getElementById('flGL'), hc=document.getElementById('flHUD'), hx=hc.getContext('2d');
    let R; try{ R=glSetup(glc); }catch(e){ R=null; console.error(e); }
    if(!R){ el.classList.remove('on'); resolve({outcome:'aborted', error:'3D desteklenmiyor', fuelLeft:opts.fuelL, damage:{}}); return; }
    const gl=R.gl;
    const P=PHYS[opts.model];
    const seed=(opts.seed|0)||7;
    // pistler: kalkış (0,0) kuzeye; varış SIM_D kuzeyde, yan kayma ve açı rastgele
    const rnd=k=>fhash(seed,k,99);
    const oKind=opts.from.kind, dKind=opts.to.kind;
    const oLen=oKind==='koy'?1100:2000, dLen=dKind==='koy'?1100:2000;
    const O=makeAirport(0,0,0,oLen,oKind==='koy'?24:40,oKind,opts.from.name);
    const dHdg=(rnd(1)-0.5)*70*D2R, dx=(rnd(2)-0.5)*5000;
    const D=makeAirport(dx,-SIM_D,dHdg,dLen,dKind==='koy'?24:40,dKind,opts.to.name);
    const W=buildWorld(R,seed,O,D,!!opts.to.coastal);
    const PL=buildPlane(R,opts.model,opts.color||'#e2504c');
    // rüzgâr
    const windFrom=rnd(3)*Math.PI*2, windSpd=(rnd(4)*7)*(opts.windMul??1);
    const windV=[-Math.sin(windFrom)*windSpd,0,Math.cos(windFrom)*windSpd];
    // durum
    const st={
      pos:O.at(25,0,P.hg), vel:[0,0,0], psi:O.hdg, th:0, ph:0, thr:0, flap:0, brake:false,
      in:{p:0,r:0}, onGround:true, engineOn:true, rough:false, leak:false, asiFail:false, altFail:false, altFrozen:0,
      fuel:opts.fuelL, fuelCap:opts.fuelCap, t:0, tAir:0, tookOff:false, airTime:0, done:false, paused:false,
      cam:'chase', camPos:null, trim:0, shake:0, stall:false, propA:0, rpm:0, damage:{engine:0,airframe:0,inst:0},
      fails:(opts.failures||[]).map(f=>({...f,done:false})), restartCd:0, msgs:[], lastTouch:null, groundRoughT:0, distReal:0,
      compress:false, phase:'ground', vsDisp:0, timeScale:1, ap:null, maxAlt:0,
    };
    st.camPos=vadd(st.pos,[0,4,14]);
    const SPEC = !!opts.spectator;
    for(const id of ['flThr','flFlap','flTrim','flBrake','flKeys']) document.getElementById(id).style.display = SPEC?'none':'';
    const snaps=[]; let lastSnapAt=performance.now(), specEnd=null, unfeed=null;
    if(SPEC && opts.feed){ unfeed = opts.feed(v=>{ if(v.s && (!snaps.length || snaps[snaps.length-1].k!==v.s.k)){ snaps.push({...v.s, rt:performance.now()}); if(snaps.length>40) snaps.shift(); lastSnapAt=performance.now(); } if(v.end && !specEnd) specEnd=v.end; }); }
    let lastB=0, bk=0;
    const AU = makeAudio(opts.model);
    if(SPEC){ const res=()=>{ try{ AU&&AU.ac.resume(); }catch(e){} }; el.addEventListener('pointerdown',res); }
    AU && AU.oneShot('start',0.9);
    // ---- girdi ----
    const keys={};
    const kd=e=>{ if(!el.classList.contains('on')) return;
      // tarayıcı kısayollarını engelle (Ctrl+S kaydet, Ctrl+D yer imi, Ctrl+F bul, Ctrl+P yazdır...)
      if(e.ctrlKey||e.metaKey||e.altKey){ e.preventDefault(); e.stopPropagation(); return; }
      keys[e.key.toLowerCase()]=true;
      if(/^[0-9]$/.test(e.key)){ st.thr = e.key==='0'?1:(+e.key)/10; }
      const k=e.key.toLowerCase();
      if(k==='v') setFlap(st.flap+1); if(k==='z') setFlap(st.flap-1); if(k==='c') toggleCam(); if(k==='escape'||k==='p') togglePause();
      if(k==='k') tryRestart();
      if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault(); };
    const ku=e=>{ keys[e.key.toLowerCase()]=false; };
    addEventListener('keydown',kd,true); addEventListener('keyup',ku,true);
    // uçarken sekme kapanırsa uyar
    const onLeave=e=>{ if(!st.done){ e.preventDefault(); e.returnValue=''; } };
    addEventListener('beforeunload',onLeave);
    const onWheel=e=>{ st.thr=clamp(st.thr-Math.sign(e.deltaY)*0.05,0,1); };
    el.addEventListener('wheel',onWheel,{passive:true});
    const coarse = matchMedia('(pointer:coarse)').matches;
    document.getElementById('flKeys').innerHTML = coarse ? '' : 'W/S veya ↑/↓: burun aşağı/yukarı · A/D: yatış · R/F veya fare tekerleği: gaz (1–0: %10–%100) · V/Z: flap artır/azalt · T/G: trim burun aşağı/yukarı · B/Boşluk: fren · C: kamera · K: motor · Esc: menü';
    // gaz çubuğu
    const thrEl=document.getElementById('flThr');
    let thrPid=null;
    const setThrFromY=y=>{ const r=thrEl.getBoundingClientRect(); st.thr=clamp(1-(y-r.top-6)/(r.height-12),0,1); };
    thrEl.addEventListener('pointerdown',e=>{ thrPid=e.pointerId; thrEl.setPointerCapture(e.pointerId); setThrFromY(e.clientY); e.stopPropagation(); });
    thrEl.addEventListener('pointermove',e=>{ if(e.pointerId===thrPid) setThrFromY(e.clientY); });
    thrEl.addEventListener('pointerup',e=>{ if(e.pointerId===thrPid) thrPid=null; });
    // butonlar
    const flapEl=document.getElementById('flFlap'), trimEl=document.getElementById('flTrim'), brakeBtn=document.getElementById('flBrake');
    function setFlap(n){ st.flap=clamp(n,0,2); }
    // kaydırma: dokunmak bir şey yapmaz; aşağı kaydır = artır, yukarı = azalt
    function slideCtl(elm,onStep,onCont){
      let pid=null,y0=0;
      elm.onpointerdown=e=>{ pid=e.pointerId; y0=e.clientY; try{elm.setPointerCapture(pid);}catch(_){} e.stopPropagation(); e.preventDefault(); };
      elm.onpointermove=e=>{ if(e.pointerId!==pid) return; const dy=e.clientY-y0;
        if(onStep){ if(Math.abs(dy)>24){ onStep(Math.sign(dy)); y0=e.clientY; } } else { onCont(dy); y0=e.clientY; } };
      elm.onpointerup=elm.onpointercancel=e=>{ if(e.pointerId===pid) pid=null; };
    }
    slideCtl(flapEl, d=>setFlap(st.flap+d));
    slideCtl(trimEl, null, dy=>{ st.trim=clamp(st.trim+dy/160,-1,1); });
    function toggleCam(){ st.cam = st.cam==='chase'?'cockpit':'chase'; }
    document.getElementById('flCam').onclick=toggleCam;
    let brakeTouch=false;
    brakeBtn.onpointerdown=e=>{ brakeTouch=true; brakeBtn.classList.add('down'); e.stopPropagation(); };
    brakeBtn.onpointerup=brakeBtn.onpointercancel=brakeBtn.onpointerleave=()=>{ brakeTouch=false; brakeBtn.classList.remove('down'); };
    const restartBtn=document.getElementById('flRestart');
    function tryRestart(){
      if(st.engineOn||st.fuel<=0||st.restartCd>0) return;
      st.restartCd=4;
      if(Math.random()<0.35){ AU&&AU.oneShot('start',0.9); st.engineOn=true; st.msgs.push({t:'Motor tekrar çalıştı! 😅',until:st.t+3}); }
      else st.msgs.push({t:'Çalışmadı… tekrar dene',until:st.t+2});
    }
    restartBtn.onclick=tryRestart;
    // joystick (sağ yarı) — eğme modunda kapalı
    const stick={id:null,ox:0,oy:0,x:0,y:0};
    const pd=e=>{ if(st.done||st.paused) return; if(e.target!==hc) return; if(FLSET.ctrl==='tilt') return;
      if(e.clientX>innerWidth*0.4 && stick.id===null){ stick.id=e.pointerId; stick.ox=e.clientX; stick.oy=e.clientY; stick.x=stick.y=0; hc.setPointerCapture(e.pointerId); } };
    const pm=e=>{ if(e.pointerId!==stick.id) return; const R0=70; let dx=e.clientX-stick.ox, dy=e.clientY-stick.oy; const L=Math.hypot(dx,dy); if(L>R0){dx*=R0/L;dy*=R0/L;} stick.x=dx/R0; stick.y=dy/R0; };
    const pu=e=>{ if(e.pointerId===stick.id){ stick.id=null; stick.x=stick.y=0; } };
    hc.addEventListener('pointerdown',pd); hc.addEventListener('pointermove',pm); hc.addEventListener('pointerup',pu); hc.addEventListener('pointercancel',pu);
    // eğme
    const tilt={r:0,p:0,n0:null};
    const onOri=e=>{
      if(e.beta==null) return;
      const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
      let r,p;
      if(ang===90){ r=e.beta; p=-e.gamma; } else if(ang===-90||ang===270){ r=-e.beta; p=e.gamma; } else { r=e.gamma; p=e.beta; }
      if(!tilt.n0) tilt.n0={r,p};
      tilt.r=clamp((r-tilt.n0.r)/28,-1,1); tilt.p=clamp((p-tilt.n0.p)/22,-1,1);
    };
    addEventListener('deviceorientation',onOri);
    const calibrate=()=>{ tilt.n0=null; };
    // ---- duraklatma menüsü ----
    const card=document.getElementById('flCard'), cardIn=document.getElementById('flCardIn');
    function togglePause(){
      if(st.done) return;
      st.paused=!st.paused;
      if(!st.paused){ card.classList.remove('on'); return; }
      const canAbort = !SPEC && !st.tookOff && st.onGround;
      cardIn.innerHTML=`<h2>⏸ Duraklatıldı</h2>
        <div class="row"><div class="grow"><b>Kontrol</b><div class="muted">Telefonda kumanda kolu ya da telefonu eğerek</div></div>
          <button class="btn ${FLSET.ctrl==='stick'?'primary':''}" data-c="stick">🕹️</button><button class="btn ${FLSET.ctrl==='tilt'?'primary':''}" data-c="tilt">📱 Eğme</button></div>
        ${FLSET.ctrl==='tilt'?'<div class="row"><div class="grow">Telefonu rahat tuttuğun açıda tut ve bas</div><button class="btn" data-cal>🎯 Kalibre et</button></div>':''}
        <div class="row"><div class="grow"><b>Ters burun ekseni</b><div class="muted">Kapalı: çubuğu kendine çekince burun kalkar (gerçek uçak gibi)</div></div><button class="btn ${FLSET.invert?'primary':''}" data-inv>${FLSET.invert?'Açık':'Kapalı'}</button></div>
        <div class="row"><div class="grow"><b>Yaklaşma halkaları</b></div><button class="btn ${FLSET.rings?'primary':''}" data-rings>${FLSET.rings?'Açık':'Kapalı'}</button></div>
        <div class="row"><div class="grow"><b>Uçuşta tam ekran</b><div class="muted">Bilgisayarda Ctrl+W gibi tuşların sekmeyi kapatmasını da engeller</div></div><button class="btn ${FLSET.fs?'primary':''}" data-fs>${FLSET.fs?'Açık':'Kapalı'}</button></div>
        <div class="row"><div class="grow"><b>Ses</b></div><button class="btn ${FLSET.sound?'primary':''}" data-snd>${FLSET.sound?'Açık':'Kapalı'}</button></div>
        <button class="btn primary" style="width:100%;margin-top:10px" data-resume>▶ Devam</button>
        ${canAbort?'<button class="btn" style="width:100%;margin-top:8px" data-abort>✖ Uçuşu iptal et</button>':''}`;
      card.classList.add('on');
    }
    document.getElementById('flPause').onclick=togglePause;
    cardIn.onclick=async e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.c){ FLSET.ctrl=b.dataset.c; saveFlset();
        if(FLSET.ctrl==='tilt' && typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){ try{ await DeviceOrientationEvent.requestPermission(); }catch(err){} }
        calibrate(); st.paused=false; togglePause(); return; }
      if(b.dataset.cal!==undefined){ calibrate(); toast('Kalibre edildi'); return; }
      if(b.dataset.inv!==undefined){ FLSET.invert=!FLSET.invert; saveFlset(); st.paused=false; togglePause(); return; }
      if(b.dataset.rings!==undefined){ FLSET.rings=!FLSET.rings; saveFlset(); st.paused=false; togglePause(); return; }
      if(b.dataset.fs!==undefined){ FLSET.fs=!FLSET.fs; saveFlset(); if(FLSET.fs) enterFlightFullscreen(true); else exitFlightFullscreen(); st.paused=false; togglePause(); return; }
      if(b.dataset.snd!==undefined){ FLSET.sound=!FLSET.sound; saveFlset(); AU&&AU.mute(!FLSET.sound); st.paused=false; togglePause(); return; }
      if(b.dataset.resume!==undefined){ togglePause(); return; }
      if(b.dataset.abort!==undefined){ finish({outcome:'aborted'}); return; }
      if(b.dataset.done!==undefined){ cleanup(); resolve(st.result); return; }
    };

    // ---- arızalar ----
    function applyFailure(f){
      if(f.type==='rough'){ st.rough=true; st.msgs.push({t:'⚠️ Gaz tam açıkken bile güç düştü',until:st.t+4}); }
      if(f.type==='engine_out'){ AU&&AU.oneShot('cut',0.9); st.engineOn=false; st.msgs.push({t:'🛑 MOTOR DURDU! Süzül ve motoru çalıştırmayı dene',until:st.t+6}); }
      if(f.type==='fuel_leak'){ st.leak=true; st.msgs.push({t:'⛽ Yakıt hızla azalıyor — en yakın piste in',until:st.t+4}); }
      if(f.type==='asi'){ st.asiFail=true; st.msgs.push({t:'📟 Hız göstergesi arızalandı',until:st.t+5}); }
      if(f.type==='alt'){ st.altFail=true; st.altFrozen=st.pos[1]; st.msgs.push({t:'📟 Altimetre takıldı',until:st.t+5}); }
    }

    // ---- fizik ----
    function rotM(){ return m4mul(m4mul(m4RY(-st.psi),m4RX(st.th)),m4RZ(-st.ph)); }
    let gustT=0, gust=[0,0,0];
    function step(dt){
      st.t+=dt; if(st.restartCd>0) st.restartCd-=dt;
      // girdiler
      let pIn=0,rIn=0;
      if(keys['w']||keys['arrowup']) pIn-=1; if(keys['s']||keys['arrowdown']) pIn+=1;

      st.flapVis=lerp(st.flapVis||0,[0,15,32][st.flap]*D2R,0.06);
      if(st.cam==='chase') drawMesh(R,PL.flap,m4mul(M,m4mul(m4T(0,PL.hinge[0],PL.hinge[1]),m4RX(st.flapVis))),{});
      for(const pp of PL.props) drawMesh(R,PL.prop,m4mul(M,m4mul(m4T(pp[0],pp[1],pp[2]),m4RZ(st.propA))),st.cam==='cockpit'?{alpha:0.18}:{});
      if(false) drawMesh(R,PL.prop,m4mul(M,m4mul(m4T(pp[0],pp[1],pp[2]),m4RZ(st.propA))),{});
      drawMesh(R,W.clouds,null,{em:0.55});
    }

    // ---- HUD ----
    let hintTxt='';
    function setHint(t){ if(t!==hintTxt){ hintTxt=t; document.getElementById('flHint').textContent=t; } }
    let warnKey='';
    function hud(){
      const c=hx; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,VW,VH);
      const pit=pitMode();
      if(st.cam==='cockpit' && !pit){
        // basit kokpit çerçevesi: alt panel + cam dikmeleri
        const ph=VH*0.2; const g=c.createLinearGradient(0,VH-ph,0,VH); g.addColorStop(0,'#2b2f35'); g.addColorStop(1,'#1b1e22');
        c.fillStyle=g; c.beginPath(); c.moveTo(0,VH); c.lineTo(0,VH-ph*0.8); c.quadraticCurveTo(VW/2,VH-ph*1.25,VW,VH-ph*0.8); c.lineTo(VW,VH); c.fill();
        c.fillStyle='#3a3f46'; c.beginPath(); c.moveTo(0,0); c.lineTo(VW*0.07,0); c.lineTo(VW*0.02,VH*0.8); c.lineTo(0,VH*0.8); c.fill();
        c.beginPath(); c.moveTo(VW,0); c.lineTo(VW*0.93,0); c.lineTo(VW*0.98,VH*0.8); c.lineTo(VW,VH*0.8); c.fill();
        if(opts.model!=='kingair'){ c.fillStyle='#d9d6cc'; c.fillRect(0,0,VW,VH*0.035); }
      }
      const V=vlen(st.vel), ktV=Math.round(vlen(vsub(st.vel,windV))*KT);
      const gh=W.heightAt(st.pos[0],st.pos[2]);
      const altFt=Math.round((st.altFail?st.altFrozen:st.pos[1]-P.hg)*FT);
      const aglFt=Math.round((st.pos[1]-P.hg-Math.max(0,gh))*FT);
      st.vsDisp=lerp(st.vsDisp,st.vel[1]*FPM,0.1);
      const mid=VW/2, top=Math.max(60, VH*0.08)+ (coarse?0:0);
      // hız kutusu
      const box=(x,y,w,label,val,col)=>{ c.fillStyle='rgba(15,22,30,.72)'; c.strokeStyle='#fff'; c.lineWidth=2; c.beginPath(); c.roundRect?c.roundRect(x,y,w,52,10):c.rect(x,y,w,52); c.fill(); c.stroke();
        c.fillStyle='#bcd'; c.font='bold 11px system-ui'; c.textAlign='left'; c.fillText(label,x+8,y+15); c.fillStyle=col||'#fff'; c.font='bold 24px system-ui'; c.fillText(val,x+8,y+42); };
      st.turnRate=lerp(st.turnRate||0, angDiff(st.psi, st.prevPsi??st.psi)/D2R/Math.max(camDt,0.001), 0.1); st.prevPsi=st.psi;
      if(pit) drawPitInstruments(c,pitLayout(VW,VH),st,P,ktV,altFt,st.vsDisp,st.turnRate);
      const spdCol = st.stallWarn?'#ff5a4f':(ktV>P.vr*KT*0.95?'#fff':'#ffd27a');
      const bx=coarse?12:20, by=coarse?Math.max(70,VH*0.18):Math.max(70,VH*0.3);
      if(!pit){
      box(bx,by,96,'HIZ (KT)', st.asiFail?'---':String(ktV), st.asiFail?'#ff8a80':spdCol);
      box(VW-bx-110,by,110,'İRTİFA (FT)', String(altFt), st.altFail?'#ff8a80':'#fff');
      c.fillStyle='rgba(15,22,30,.72)'; c.fillRect(VW-bx-110,by+56,110,20); c.fillStyle='#fff'; c.font='bold 12px system-ui'; c.textAlign='left';
      c.fillText((st.vsDisp>=0?'↑ ':'↓ ')+Math.abs(Math.round(st.vsDisp/10)*10)+' fpm',VW-bx-104,by+70);
      c.fillStyle='rgba(15,22,30,.72)'; c.fillRect(bx,by+56,96,20); c.fillStyle='#fff'; c.fillText('AGL '+Math.max(0,aglFt)+' ft',bx+6,by+70);
      }
      // yapay ufuk + pusula
      const land = VW>VH && VH<560;
      const ar=land?30:(coarse?40:56), ax=mid, ay=land? 50+ar : (VW<560? 118 : top+66);
      const L=rwyLocal(D,st.pos[0],st.pos[2]); const s=-L.a;
      if(!pit){
      c.save(); c.beginPath(); c.arc(ax,ay,ar,0,7); c.clip();
      c.translate(ax,ay); c.rotate(-st.ph); const po=st.th/D2R*ar/30;
      c.fillStyle='#3d8fd6'; c.fillRect(-ar*2,-ar*2+po,ar*4,ar*2); c.fillStyle='#8a5a2b'; c.fillRect(-ar*2,po,ar*4,ar*2);
      c.strokeStyle='#fff'; c.lineWidth=2; c.beginPath(); c.moveTo(-ar*2,po); c.lineTo(ar*2,po); c.stroke();
      c.lineWidth=1; for(const pd of [-20,-10,10,20]){ const yy=po-pd*ar/30; c.beginPath(); c.moveTo(-ar*0.25,yy); c.lineTo(ar*0.25,yy); c.stroke(); }
      c.restore();
      c.strokeStyle='#fff'; c.lineWidth=3; c.beginPath(); c.arc(ax,ay,ar,0,7); c.stroke();
      c.strokeStyle='#ffcc33'; c.lineWidth=4; c.beginPath(); c.moveTo(ax-ar*0.6,ay); c.lineTo(ax-ar*0.18,ay); c.lineTo(ax-ar*0.1,ay+6); c.moveTo(ax+ar*0.6,ay); c.lineTo(ax+ar*0.18,ay); c.lineTo(ax+ar*0.1,ay+6); c.stroke();
      // ILS (yaklaşmada)
      if(s>200 && s<9000){
        const locDev=clamp(Math.atan2(L.b,s)/D2R/2.5,-1,1); // ±2.5° tam sapma
        const gsDev=clamp((Math.atan2(st.pos[1]-P.hg-15,s)/D2R-3)/0.7,-1,1);
        c.fillStyle='#ff4fd8'; c.beginPath(); c.arc(ax-locDev*ar*0.85,ay+ar-8,5,0,7); c.fill();
        c.beginPath(); c.arc(ax+ar-8,ay+gsDev*ar*0.85,5,0,7); c.fill();
      }
      }
      // pusula
      const hdg=((st.psi/D2R)%360+360)%360;
      const brg=((Math.atan2(D.x-st.pos[0],-(D.z-st.pos[2]))/D2R)%360+360)%360;
      const gate=D.at(-APP_GATE,0); const tgtB = s>APP_GATE+300? ((Math.atan2(gate[0]-st.pos[0],-(gate[2]-st.pos[2]))/D2R)%360+360)%360 : ((D.hdg/D2R - clamp(L.b*0.006,-0.6,0.6)/D2R)%360+360)%360;
      c.fillStyle='rgba(15,22,30,.72)'; const cw=VW<560?148:170; const cX= pit? mid : (land? ax+ar+14+cw/2 : ax), cY= pit? 50 : (land? ay-20 : ay+ar+8); c.fillRect(cX-cw/2,cY,cw,40);
      c.fillStyle='#fff'; c.font='bold 14px system-ui'; c.textAlign='center';
      const dd=Math.hypot(D.x-st.pos[0],D.z-st.pos[2]), gR=APP_GATE+700, legK=opts.distKm||100;
      const kmLeft = dd>gR ? gR/1000 + (dd-gR)/(SIM_D-gR)*Math.max(0,legK-gR/1000) : dd/1000;
      c.font=(VW<560?'bold 13px':'bold 14px')+' system-ui'; c.fillText(`YÖN ${String(Math.round(hdg)).padStart(3,'0')}° · ${kmLeft.toFixed(kmLeft<10?1:0)} km`,cX,cY+16);
      const db=angDiff(tgtB*D2R,hdg*D2R)/D2R;
      c.fillStyle= Math.abs(db)<5?'#7dffa0':'#ffcc33'; c.font='bold 13px system-ui';
      c.fillText(Math.abs(db)<5?'▲ Rota doğru':(db>0?'Sağa dön ▶ '+Math.round(db)+'°':'◀ Sola dön '+Math.round(-db)+'°'),cX,cY+33);
      // alt durum satırı
      const fuelPct=st.fuel/st.fuelCap;
      const lines=[`⛽ ${Math.round(st.fuel)} L`, `FLAP ${st.flap} · TRİM ${st.trim>0.03?'↑':(st.trim<-0.03?'↓':'—')}${Math.abs(Math.round(st.trim*100))}`, `Rüzgâr ${String(Math.round(windFrom/D2R)).padStart(3,'0')}°/${Math.round(windSpd*KT)} kt`];
      c.textAlign='right'; c.font='bold 12px system-ui';
      lines.forEach((t,i)=>{ c.fillStyle='rgba(15,22,30,.6)'; const w=c.measureText(t).width+12; c.fillRect(VW-bx-w,by+82+i*20,w,18); c.fillStyle=(i===0&&fuelPct<0.15)?'#ff8a80':'#fff'; c.fillText(t,VW-bx-6,by+95+i*20); });
      if(satT){ c.textAlign='right'; c.font='10px system-ui'; c.fillStyle='rgba(255,255,255,.75)'; c.fillText('Uydu: USGS / USDA NAIP',VW-8,VH-6); }
      if(st.compress){ c.textAlign='center'; c.fillStyle='rgba(255,204,51,.9)'; c.font='bold 15px system-ui'; c.fillText('⏩ Hızlı seyir ×'+COMPRESS,mid,(land?ay+ar+20:ay+ar+64)); }
      // gaz göstergesi
      if(flapEl._n!==st.flap){ flapEl._n=st.flap; flapEl.querySelectorAll('.flN').forEach(n=>n.classList.toggle('on',+n.dataset.n===st.flap)); }
      const tm=document.getElementById('flTrimMark'), tw=document.getElementById('flTrimWheel');
      if(tm && tw){ const top=tw.offsetTop, h=tw.offsetHeight; tm.style.top=(top+h/2+st.trim*h/2-2)+'px'; }
      document.getElementById('flThrFill').style.height=`calc(${st.thr*100}% - ${st.thr*12}px)`;
      document.getElementById('flThrLbl').textContent='GAZ '+Math.round(st.thr*100)+'%';
      // joystick
      if(stick.id!==null){ c.fillStyle='rgba(255,248,236,.18)'; c.strokeStyle='rgba(255,255,255,.7)'; c.lineWidth=3; c.beginPath(); c.arc(stick.ox,stick.oy,70,0,7); c.fill(); c.stroke(); c.fillStyle='rgba(255,248,236,.9)'; c.beginPath(); c.arc(stick.ox+stick.x*70,stick.oy+stick.y*70,26,0,7); c.fill(); }
      else if(coarse && FLSET.ctrl!=='tilt'){ c.strokeStyle='rgba(255,255,255,.4)'; c.lineWidth=2; c.beginPath(); c.arc(VW-110,VH-130,60,0,7); c.stroke(); c.fillStyle='rgba(255,255,255,.55)'; c.font='bold 12px system-ui'; c.textAlign='center'; c.fillText('Kumanda',VW-110,VH-126); }
      // uyarılar
      const W2=[];
      if(st.stallWarn) W2.push(['STALL! Burnu indir',1]);
      if(!st.engineOn) W2.push([st.fuel<=0?'YAKIT YOK':'MOTOR DURDU',1]);
      if(st.rough&&st.engineOn) W2.push(['MOTOR TEKLİYOR',0]);
      if(st.leak) W2.push(['YAKIT KAÇAĞI',0]);
      if(fuelPct<0.12&&st.fuel>0) W2.push(['YAKIT AZ',0]);
      if(!st.onGround && aglFt<250 && st.vsDisp<-1200) W2.push(['PULL UP!',1]);
      for(const m of st.msgs) if(m.until>st.t) W2.push([m.t,0]);
      if(SPEC){ W2.length=0; for(const t of (st.specW||[])) W2.push([t,0]); }
      W2.splice(4); st.warnTexts=W2.map(w=>w[0]);
      const key=W2.map(w=>w[0]).join('|');
      if(key!==warnKey){ warnKey=key; document.getElementById('flWarn').innerHTML=W2.map(w=>`<div class="${w[1]?'':'amber'}">${w[0]}</div>`).join(''); }
      restartBtn.style.display = (!SPEC && !st.engineOn && st.fuel>0 && !st.done) ? 'block':'none';
      // ipucu
      const ktR=Math.round(P.vr*KT);
      let h='';
      if(!st.tookOff){ h = st.thr<0.9 ? 'Gazı tamamen aç' + (coarse?' (soldaki GAZ çubuğu)':' (R tuşu)') : (ktV<ktR ? `Hızlan… ${ktR} kt'da çubuğu kendine çek` : 'Şimdi çubuğu kendine çek ve kalk!'); }
      else if(st.onGround) h='Fren yap ve dur';
      else if(s>APP_GATE && aglFt<500) h='Tırmanmaya devam et (500 ft üstünde hızlı seyir başlar)';
      else if(s>APP_GATE) h = st.compress ? 'Hızlı seyir — rotayı tut' : 'Rotayı takip et';
      else if(s>0) h='Yaklaşma: halkalardan geç, gazı azalt, flap aç, hız ~'+Math.round(P.vr*KT*1.25)+' kt';
      else h='Pistin üzerindesin — burnu hafif kaldır, yumuşak koy';
      if(SPEC) h='🧳 Yolcusun — pilot: '+opts.spectator.pilot+(st.compress?' · ⏩ hızlı seyir':'');
      setHint(h);
    }

    // ---- döngü ----
    let last=performance.now(), raf=0, acc=0;
    function frame(now){
      const dt=Math.min(0.05,(now-last)/1000); last=now;
      if(!st.paused && !st.done){
        acc+=dt*(st.timeScale||1); const h=1/120; let n=0;
        if(SPEC){ specUpdate(dt); acc=0; } else while(acc>=h && n<480){ step(h); acc-=h; n++; if(st.done) break; }
        if(opts.broadcast && !st.done && now-lastB>120){ lastB=now; bk++; opts.broadcast({k:bk, p:st.pos.map(v=>+v.toFixed(2)), v:st.vel.map(v=>+v.toFixed(2)), a:[+st.psi.toFixed(4),+st.th.toFixed(4),+st.ph.toFixed(4)], thr:+st.thr.toFixed(2), fl:st.flap, tr:+(st.trim||0).toFixed(2), e:st.engineOn?1:0, g:st.onGround?1:0, f:Math.round(st.fuel), sw:st.stallWarn?1:0, c:st.compress?1:0, to:st.tookOff?1:0, w:st.warnTexts||[]}); }
        if(st.done) acc=0;
      }
      st.shake=Math.max(st.shake-dt*1.5, (st.rough&&st.engineOn)?0.08:0); // tekleme: hafif sabit titreşim (birikmez)
      const rpmT = st.engineOn ? 0.22+0.78*st.thr : Math.min(0.25,vlen(st.vel)/90);
      st.rpm=lerp(st.rpm,rpmT,0.05); st.propA+= st.rpm*dt*60;
      AU && AU.set(st.paused||st.done?0:st.rpm*(st.rough&&st.engineOn?(0.85+0.15*Math.sin(st.t*9)):1), st.paused?0:vlen(st.vel), st.stallWarn&&!st.paused&&!st.done, st.t, st.rough&&st.engineOn&&!st.paused);
      camDt=dt; render(); hud();
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
    // test erişimi
    window.__fl={st,O,D,W,P,finish,setAP:f=>st.ap=f};
    window.__makeAudio=makeAudio;
  });
}

</script>
