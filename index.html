  #flThrFill{position:absolute;left:6px;right:6px;bottom:6px;background:linear-gradient(#ffb15c,#e8913a);border-radius:10px}
  #flThrLbl{position:absolute;left:0;right:0;top:-24px;text-align:center;font-weight:900;color:#fff;text-shadow:0 1px 3px #000;font-size:14px}
  #flRestart{display:none;left:50%;transform:translateX(-50%);top:54%;background:#ffcc33}
  #flCard{position:absolute;inset:0;background:rgba(10,20,30,.55);display:none;align-items:center;justify-content:center;padding:16px}
  #flCard.on{display:flex}
  #flCard .card{max-width:420px}
  #flKeys{position:absolute;left:12px;bottom:10px;color:#fff;font-size:12px;text-shadow:0 1px 2px #000;pointer-events:none;line-height:1.4}
  `;
  document.head.appendChild(css);
  el=document.createElement('div'); el.id='flight';
  el.innerHTML=`<canvas id="flGL"></canvas><canvas id="flHUD"></canvas>
  <div id="flHint"></div><div id="flWarn"></div>
  <div id="flThr"><div id="flThrLbl">GAZ 0%</div><div id="flThrFill"></div></div>
  <button class="flBtn" id="flFlap" style="left:88px;bottom:calc(128px + env(safe-area-inset-bottom))">FLAP 0</button>
  <button class="flBtn" id="flBrake" style="left:88px;bottom:calc(72px + env(safe-area-inset-bottom))">FREN</button>
  <button class="flBtn" id="flCam" style="left:88px;bottom:calc(16px + env(safe-area-inset-bottom))">📷</button>
  <button class="flBtn" id="flPause" style="right:12px;top:calc(8px + env(safe-area-inset-top));min-width:48px;font-weight:900">II</button>
  <button class="flBtn" id="flRestart">🔑 Motoru çalıştır</button>
  <div id="flKeys"></div>
  <div id="flCard"><div class="card" id="flCardIn"></div></div>`;
  document.body.appendChild(el);
  return el;
}

/* ---------- ana uçuş fonksiyonu ---------- */
function startFlight(opts){
  return new Promise(resolve=>{
    const el=flightDOM(); el.classList.add('on');
    const glc=document.getElementById('flGL'), hc=document.getElementById('flHUD'), hx=hc.getContext('2d');
    let R; try{ R=glSetup(glc); }catch(e){ R=null; console.error(e); }
    if(!R){ el.classList.remove('on'); resolve({outcome:'aborted', error:'3D desteklenmiyor', fuelLeft:opts.fuelL, damage:{}}); return; }
    const gl=R.gl;
    const P=PHYS[opts.model];
    const seed=(opts.seed|0)||7;
    // pistler: kalkış (0,0) kuzeye; varış SIM_D kuzeyde, yan kayma ve açı rastgele
    const rnd=k=>fhash(seed,k,99);
    const oKind=opts.from.kind, dKind=opts.to.kind;
    const oLen=oKind==='koy'?1100:2000, dLen=dKind==='koy'?1100:2000;
    const O=makeAirport(0,0,0,oLen,oKind==='koy'?24:40,oKind,opts.from.name);
    const dHdg=(rnd(1)-0.5)*70*D2R, dx=(rnd(2)-0.5)*5000;
    const D=makeAirport(dx,-SIM_D,dHdg,dLen,dKind==='koy'?24:40,dKind,opts.to.name);
    const W=buildWorld(R,seed,O,D,!!opts.to.coastal);
    const PL=buildPlane(R,opts.model,opts.color||'#e2504c');
    // rüzgâr
    const windFrom=rnd(3)*Math.PI*2, windSpd=(rnd(4)*7)*(opts.windMul??1);
    const windV=[-Math.sin(windFrom)*windSpd,0,Math.cos(windFrom)*windSpd];
    // durum
    const st={
      pos:O.at(25,0,P.hg), vel:[0,0,0], psi:O.hdg, th:0, ph:0, thr:0, flap:0, brake:false,
      in:{p:0,r:0}, onGround:true, engineOn:true, rough:false, leak:false, asiFail:false, altFail:false, altFrozen:0,
      fuel:opts.fuelL, fuelCap:opts.fuelCap, t:0, tAir:0, tookOff:false, airTime:0, done:false, paused:false,
      cam:'chase', camPos:null, shake:0, stall:false, propA:0, rpm:0, damage:{engine:0,airframe:0,inst:0},
      fails:(opts.failures||[]).map(f=>({...f,done:false})), restartCd:0, msgs:[], lastTouch:null, groundRoughT:0, distReal:0,
      compress:false, phase:'ground', vsDisp:0, timeScale:1, ap:null, maxAlt:0,
    };
    st.camPos=vadd(st.pos,[0,4,14]);
    const AU = makeAudio();
    // ---- girdi ----
    const keys={};
    const kd=e=>{ if(!el.classList.contains('on')) return; keys[e.key.toLowerCase()]=true;
      const k=e.key.toLowerCase();
      if(k==='v') cycleFlap(); if(k==='c') toggleCam(); if(k==='escape'||k==='p') togglePause();
      if(k==='k') tryRestart();
      if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault(); };
    const ku=e=>{ keys[e.key.toLowerCase()]=false; };
    addEventListener('keydown',kd,true); addEventListener('keyup',ku,true);
    const onWheel=e=>{ st.thr=clamp(st.thr-Math.sign(e.deltaY)*0.05,0,1); };
    el.addEventListener('wheel',onWheel,{passive:true});
    const coarse = matchMedia('(pointer:coarse)').matches;
    document.getElementById('flKeys').innerHTML = coarse ? '' : 'W/S veya ↑/↓: burun aşağı/yukarı · A/D: yatış · R/F: gaz · V: flap · B/Boşluk: fren · C: kamera · K: motor · Esc: menü';
    // gaz çubuğu
    const thrEl=document.getElementById('flThr');
    let thrPid=null;
    const setThrFromY=y=>{ const r=thrEl.getBoundingClientRect(); st.thr=clamp(1-(y-r.top-6)/(r.height-12),0,1); };
    thrEl.addEventListener('pointerdown',e=>{ thrPid=e.pointerId; thrEl.setPointerCapture(e.pointerId); setThrFromY(e.clientY); e.stopPropagation(); });
    thrEl.addEventListener('pointermove',e=>{ if(e.pointerId===thrPid) setThrFromY(e.clientY); });
    thrEl.addEventListener('pointerup',e=>{ if(e.pointerId===thrPid) thrPid=null; });
    // butonlar
    const flapBtn=document.getElementById('flFlap'), brakeBtn=document.getElementById('flBrake');
    function cycleFlap(){ st.flap=(st.flap+1)%3; flapBtn.textContent='FLAP '+st.flap; }
    function toggleCam(){ st.cam = st.cam==='chase'?'cockpit':'chase'; }
    flapBtn.onclick=cycleFlap; document.getElementById('flCam').onclick=toggleCam;
    let brakeTouch=false;
    brakeBtn.onpointerdown=e=>{ brakeTouch=true; brakeBtn.classList.add('down'); e.stopPropagation(); };
    brakeBtn.onpointerup=brakeBtn.onpointercancel=brakeBtn.onpointerleave=()=>{ brakeTouch=false; brakeBtn.classList.remove('down'); };
    const restartBtn=document.getElementById('flRestart');
    function tryRestart(){
      if(st.engineOn||st.fuel<=0||st.restartCd>0) return;
      st.restartCd=4;
      if(Math.random()<0.35){ st.engineOn=true; st.msgs.push({t:'Motor tekrar çalıştı! 😅',until:st.t+3}); }
      else st.msgs.push({t:'Çalışmadı… tekrar dene',until:st.t+2});
    }
    restartBtn.onclick=tryRestart;
    // joystick (sağ yarı) — eğme modunda kapalı
    const stick={id:null,ox:0,oy:0,x:0,y:0};
    const pd=e=>{ if(st.done||st.paused) return; if(e.target!==hc) return; if(FLSET.ctrl==='tilt') return;
      if(e.clientX>innerWidth*0.4 && stick.id===null){ stick.id=e.pointerId; stick.ox=e.clientX; stick.oy=e.clientY; stick.x=stick.y=0; hc.setPointerCapture(e.pointerId); } };
    const pm=e=>{ if(e.pointerId!==stick.id) return; const R0=70; let dx=e.clientX-stick.ox, dy=e.clientY-stick.oy; const L=Math.hypot(dx,dy); if(L>R0){dx*=R0/L;dy*=R0/L;} stick.x=dx/R0; stick.y=dy/R0; };
    const pu=e=>{ if(e.pointerId===stick.id){ stick.id=null; stick.x=stick.y=0; } };
    hc.addEventListener('pointerdown',pd); hc.addEventListener('pointermove',pm); hc.addEventListener('pointerup',pu); hc.addEventListener('pointercancel',pu);
    // eğme
    const tilt={r:0,p:0,n0:null};
    const onOri=e=>{
      if(e.beta==null) return;
      const ang=(screen.orientation&&screen.orientation.angle)||window.orientation||0;
      let r,p;
      if(ang===90){ r=e.beta; p=-e.gamma; } else if(ang===-90||ang===270){ r=-e.beta; p=e.gamma; } else { r=e.gamma; p=e.beta; }
      if(!tilt.n0) tilt.n0={r,p};
      tilt.r=clamp((r-tilt.n0.r)/28,-1,1); tilt.p=clamp((p-tilt.n0.p)/22,-1,1);
    };
    addEventListener('deviceorientation',onOri);
    const calibrate=()=>{ tilt.n0=null; };
    // ---- duraklatma menüsü ----
    const card=document.getElementById('flCard'), cardIn=document.getElementById('flCardIn');
    function togglePause(){
      if(st.done) return;
      st.paused=!st.paused;
      if(!st.paused){ card.classList.remove('on'); return; }
      const canAbort = !st.tookOff && st.onGround;
      cardIn.innerHTML=`<h2>⏸ Duraklatıldı</h2>
        <div class="row"><div class="grow"><b>Kontrol</b><div class="muted">Telefonda kumanda kolu ya da telefonu eğerek</div></div>
          <button class="btn ${FLSET.ctrl==='stick'?'primary':''}" data-c="stick">🕹️</button><button class="btn ${FLSET.ctrl==='tilt'?'primary':''}" data-c="tilt">📱 Eğme</button></div>
        ${FLSET.ctrl==='tilt'?'<div class="row"><div class="grow">Telefonu rahat tuttuğun açıda tut ve bas</div><button class="btn" data-cal>🎯 Kalibre et</button></div>':''}
        <div class="row"><div class="grow"><b>Ters burun ekseni</b><div class="muted">Kapalı: çubuğu kendine çekince burun kalkar (gerçek uçak gibi)</div></div><button class="btn ${FLSET.invert?'primary':''}" data-inv>${FLSET.invert?'Açık':'Kapalı'}</button></div>
        <div class="row"><div class="grow"><b>Yaklaşma halkaları</b></div><button class="btn ${FLSET.rings?'primary':''}" data-rings>${FLSET.rings?'Açık':'Kapalı'}</button></div>
        <div class="row"><div class="grow"><b>Ses</b></div><button class="btn ${FLSET.sound?'primary':''}" data-snd>${FLSET.sound?'Açık':'Kapalı'}</button></div>
        <button class="btn primary" style="width:100%;margin-top:10px" data-resume>▶ Devam</button>
        ${canAbort?'<button class="btn" style="width:100%;margin-top:8px" data-abort>✖ Uçuşu iptal et</button>':''}`;
      card.classList.add('on');
    }
    document.getElementById('flPause').onclick=togglePause;
    cardIn.onclick=async e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.c){ FLSET.ctrl=b.dataset.c; saveFlset();
        if(FLSET.ctrl==='tilt' && typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission){ try{ await DeviceOrientationEvent.requestPermission(); }catch(err){} }
        calibrate(); st.paused=false; togglePause(); return; }
      if(b.dataset.cal!==undefined){ calibrate(); toast('Kalibre edildi'); return; }
      if(b.dataset.inv!==undefined){ FLSET.invert=!FLSET.invert; saveFlset(); st.paused=false; togglePause(); return; }
      if(b.dataset.rings!==undefined){ FLSET.rings=!FLSET.rings; saveFlset(); st.paused=false; togglePause(); return; }
      if(b.dataset.snd!==undefined){ FLSET.sound=!FLSET.sound; saveFlset(); AU&&AU.mute(!FLSET.sound); st.paused=false; togglePause(); return; }
      if(b.dataset.resume!==undefined){ togglePause(); return; }
      if(b.dataset.abort!==undefined){ finish({outcome:'aborted'}); return; }
      if(b.dataset.done!==undefined){ cleanup(); resolve(st.result); return; }
    };

    // ---- arızalar ----
    function applyFailure(f){
      if(f.type==='rough'){ st.rough=true; st.msgs.push({t:'⚠️ Gaz tam açıkken bile güç düştü',until:st.t+4}); }
      if(f.type==='engine_out'){ st.engineOn=false; st.msgs.push({t:'🛑 MOTOR DURDU! Süzül ve motoru çalıştırmayı dene',until:st.t+6}); }
      if(f.type==='fuel_leak'){ st.leak=true; st.msgs.push({t:'⛽ Yakıt hızla azalıyor — en yakın piste in',until:st.t+4}); }
      if(f.type==='asi'){ st.asiFail=true; st.msgs.push({t:'📟 Hız göstergesi arızalandı',until:st.t+5}); }
      if(f.type==='alt'){ st.altFail=true; st.altFrozen=st.pos[1]; st.msgs.push({t:'📟 Altimetre takıldı',until:st.t+5}); }
    }

    // ---- fizik ----
    function rotM(){ return m4mul(m4mul(m4RY(-st.psi),m4RX(st.th)),m4RZ(-st.ph)); }
    let gustT=0, gust=[0,0,0];
    function step(dt){
      st.t+=dt; if(st.restartCd>0) st.restartCd-=dt;
      // girdiler
      let pIn=0,rIn=0;
      if(keys['w']||keys['arrowup']) pIn-=1; if(keys['s']||keys['arrowdown']) pIn+=1;
      if(keys['a']||keys['arrowleft']) rIn-=1; if(keys['d']||keys['arrowright']) rIn+=1;
      if(keys['r']||keys['shift']||keys['pageup']) st.thr=clamp(st.thr+dt*0.6,0,1);
      if(keys['f']||keys['control']||keys['pagedown']) st.thr=clamp(st.thr-dt*0.6,0,1);
      if(FLSET.ctrl==='tilt' && coarse){ pIn+= -tilt.p; rIn+=tilt.r; }
      else { pIn+=stick.y; rIn+=stick.x; }  // çubuğu aşağı çekmek = burun yukarı
      if(FLSET.invert) pIn=-pIn;
      if(st.ap){ const a=st.ap(st); if(a){ pIn=a.p; rIn=a.r; if(a.thr!=null) st.thr=a.thr; if(a.flap!=null) st.flap=a.flap; if(a.brake!=null) st.apBrake=a.brake; } }
      pIn=clamp(pIn,-1,1); rIn=clamp(rIn,-1,1);
      st.in.p=lerp(st.in.p,pIn,clamp(dt*8,0,1)); st.in.r=lerp(st.in.r,rIn,clamp(dt*8,0,1));
      st.brake = !!(keys[' ']||keys['b']||brakeTouch||st.apBrake);
      // arızalar zamanla
      if(st.tookOff) for(const f of st.fails){ if(!f.done && st.tAir>=f.at){ f.done=true; applyFailure(f); } }
      // rüzgâr + türbülans
      gustT-=dt; if(gustT<=0){ gustT=0.6+Math.random()*1.2; const agl=st.pos[1]-W.heightAt(st.pos[0],st.pos[2]); const tb=(0.4+windSpd*0.12)*(agl<300?1:0.5); gust=[(Math.random()-0.5)*tb*2,(Math.random()-0.5)*tb*1.4,(Math.random()-0.5)*tb*2]; }
      const wind = st.onGround ? vscl(windV,0.5) : vadd(windV,gust);
      const Rm=rotM(), right=[Rm[0],Rm[1],Rm[2]], up=[Rm[4],Rm[5],Rm[6]], fwd=[-Rm[8],-Rm[9],-Rm[10]];
      const air=vsub(st.vel,wind), V=vlen(air), airDir=V>0.5?vscl(air,1/V):fwd;
      const alpha=V>2?Math.atan2(-vdot(air,up),vdot(air,fwd)):0;
      const beta=V>2?Math.atan2(vdot(air,right),vdot(air,fwd)):0;
      const q=0.5*RHO*V*V;
      const flapCL=[0,0.35,0.7][st.flap], flapCD=[0,0.012,0.04][st.flap];
      const aS=(15-st.flap*1.0)*D2R;
      let CL=P.cl0+5.0*alpha+flapCL; const clMax=P.clmax+flapCL*0.75;
      st.stall=false;
      if(alpha>aS){ CL=Math.max(clMax*0.55, clMax-(alpha-aS)*4.5); st.stall=!st.onGround; }
      else CL=Math.min(CL,clMax);
      if(alpha<-12*D2R) CL=Math.max(CL,-0.6);
      st.stallWarn = !st.onGround && alpha>aS-4*D2R && V>5;
      const CD=P.cd0+P.k*CL*CL+flapCD+(st.stall?0.08:0);
      const liftDir=vnorm(vcross(right,airDir));
      let F=vadd(vscl(liftDir,q*P.S*CL), vscl(airDir,-q*P.S*CD));
      F=vadd(F, vscl(right,-beta*q*P.S*0.6));
      // motor
      const engF = st.engineOn ? (st.rough? 0.55+0.1*Math.sin(st.t*7) : 1) : 0;
      const thrust = st.thr*P.Tmax*engF*Math.max(0,1-V/P.vprop);
      F=vadd(F, vscl(fwd,thrust));
      F[1]-=P.mass*GRAV;
      // yer
      const gh=W.heightAt(st.pos[0],st.pos[2]);
      const water=W.isWater(st.pos[0],st.pos[2]);
      const surf = (onRunway(O,st.pos[0],st.pos[2])||onRunway(D,st.pos[0],st.pos[2])) ? 'runway' : (water?'water':'grass');
      const groundY = (surf==='runway'?0.05:gh) + P.hg;
      if(st.onGround){
        const vH=vlen([st.vel[0],0,st.vel[2]]);
        const mu=(surf==='runway'?0.022:0.07)+(st.brake?(surf==='runway'?0.42:0.3):0);
        const N=Math.max(0,P.mass*GRAV-Math.max(0,vdot(liftDir,[0,1,0])*q*P.S*CL));
        if(vH>0.05){ const fr=Math.min(mu*N, vH*P.mass/dt*0.9); F=vadd(F, vscl([st.vel[0],0,st.vel[2]],-fr/vH)); }
        else if(thrust<mu*N){ st.vel[0]=st.vel[2]=0; }
      }
      // entegrasyon
      st.vel=vadd(st.vel,vscl(F,dt/P.mass));
      if(st.onGround){
        // yanal kaymayı yok et (tekerlek)
        const lat=vdot(st.vel,right); st.vel=vsub(st.vel,vscl(right,lat*clamp(dt*12,0,1)));
        if(st.vel[1]<0) st.vel[1]=0;
      }
      const agl0=st.pos[1]-groundY;
      const dO=Math.hypot(st.pos[0]-O.x,st.pos[2]-O.z), dDst=Math.hypot(st.pos[0]-D.x,st.pos[2]-D.z);
      st.compress = !st.onGround && agl0>150 && dO>2000 && dDst>APP_GATE+700 && !st.stall;
      const K=st.compress?COMPRESS:1;
      const dpos=[st.vel[0]*dt*K, st.vel[1]*dt, st.vel[2]*dt*K];
      st.pos=vadd(st.pos,dpos);
      const legKm=opts.distKm||100;
      st.distReal += Math.hypot(dpos[0],dpos[2])/SIM_D*legKm;
      // yakıt (gerçek km bazlı + rölanti)
      const burnKm=opts.perKm*Math.hypot(dpos[0],dpos[2])/SIM_D*legKm*(0.55+0.6*st.thr)/(0.55+0.6*0.75);
      const idle=opts.perKm*0.02*dt*(st.engineOn?1:0);
      st.fuel-= (burnKm+idle)*(st.leak?3:1)*(st.engineOn?1:0.2);
      if(st.fuel<=0){ st.fuel=0; if(st.engineOn){ st.engineOn=false; st.msgs.push({t:'⛽ YAKIT BİTTİ!',until:st.t+6}); } }
      // dönüş dinamiği
      const e=clamp((V/(P.vr*1.1))**2,0,1.4);
      if(!st.onGround){
        st.ph += (st.in.r*P.roll*e - st.ph*0.12*e)*dt;
        if(st.stall && Math.random()<dt*2) st.ph+=(Math.random()-0.5)*0.4;
        st.ph=clamp(st.ph,-75*D2R,75*D2R);
        const aTrim=0.035;
        st.th += (st.in.p*P.pitch*e + P.stab*Math.min(e,1)*(aTrim-alpha)*Math.cos(st.ph))*dt;
        // yön hava akışını izler
        const hdgAir=Math.atan2(air[0],-air[2]);
        st.psi += angDiff(hdgAir,st.psi)*clamp(3*e,0,4)*dt;
        st.th=clamp(st.th,-60*D2R,60*D2R);
      } else {
        const vG=vlen([st.vel[0],0,st.vel[2]]);
        st.psi += st.in.r*0.5*clamp(vG/6,0,1)*clamp(12/(vG+1),0.15,1)*dt;
        // yerde hız yönü burunla aynı
        const sp=vdot(st.vel,fwd); const hv=[Math.sin(st.psi)*sp,0,-Math.cos(st.psi)*sp];
        st.vel=[lerp(st.vel[0],hv[0],clamp(dt*6,0,1)),st.vel[1],lerp(st.vel[2],hv[2],clamp(dt*6,0,1))];
        const rot=st.in.p*P.pitch*e*0.9 + (st.th>0? -0.25*(1-e*0.6):0);
        st.th=clamp(st.th+rot*dt,0,13*D2R);
        st.ph*=Math.max(0,1-dt*8);
      }
      // yere temas
      const gy=groundY;
      if(st.pos[1]<=gy){
        if(!st.onGround){ touchdown(surf,gh); if(st.done) return; }
        st.pos[1]=gy; st.onGround=true; if(st.vel[1]<0) st.vel[1]=0;
      } else if(st.onGround && st.pos[1]>gy+0.05){
        st.onGround=false;
      }
      if(!st.onGround){ st.tAir+= dt; st.airTime+=dt; if(st.airTime>1.5 && agl0>8) st.tookOff=true; }
      else st.airTime=0;
      st.maxAlt=Math.max(st.maxAlt,agl0);
      // çarpışma: arazi eğimi dik ve havada
      if(!st.onGround){
        const tgh=W.heightAt(st.pos[0],st.pos[2]);
        if(st.pos[1]<tgh+0.5 && surf!=='runway'){ crash('Araziye çarptın'); return; }
      }
      // yerde: pist dışı hızlı gidiş
      if(st.onGround && surf==='grass'){ const vG=vlen(st.vel); if(vG>12){ st.groundRoughT+=dt; st.shake=Math.max(st.shake,0.3); if(st.groundRoughT>0.3 && vG>38){ crash('Pist dışında çok hızlı gittin'); return; } } }
      if(st.onGround && surf==='water'){ crash('Uçak suya gömüldü'); return; }
      // varış / durma kontrolü
      if(st.onGround && st.tookOff){
        const vG=vlen(st.vel);
        if(vG<2.5){
          if(onRunway(D,st.pos[0],st.pos[2],30)) finish({outcome:'landed'});
          else if(onRunway(O,st.pos[0],st.pos[2],30)) finish({outcome:'returned'});
          else finish({outcome:'forced', nearDest: dDst<3500});
        }
      }
      if(!st.tookOff && st.onGround && !onRunway(O,st.pos[0],st.pos[2],40) && vlen(st.vel)<2){ /* çimde durdu: sorun yok */ }
    }
    function touchdown(surf,gh){
      const vs=-st.vel[1], V=vlen(st.vel), bank=Math.abs(st.ph)/D2R, pitch=st.th/D2R;
      st.lastTouch={vs,V,bank,pitch,surf};
      if(!st.tookOff) return;
      AU&&AU.thump(Math.min(1,vs/3));
      st.shake=Math.max(st.shake,Math.min(1,vs/3));
      if(surf==='water'){ crash('Suya indin'); return; }
      if(vs>5 || bank>20 || pitch< -4){ crash(vs>5?'Çok sert çarptın ('+Math.round(vs*FPM)+' fpm)':(bank>20?'Kanat yere sürttü':'Burun tekerleğiyle çakıldın')); return; }
      if(surf==='grass' && (vs>3.5 || V>42)){ crash('Arazi çok engebeli, uçak devrildi'); return; }
      let dmg=0; if(vs>3.2) dmg=18; else if(vs>2) dmg=6; if(surf==='grass') dmg+=12;
      st.damage.airframe+=dmg;
      st.landingVs=Math.max(st.landingVs||0, vs);
      if(!st.firstTouchVs) st.firstTouchVs=vs;
    }
    function crash(why){
      if(st.done) return;
      st.vel=[0,0,0]; st.damage.airframe+=60; st.damage.engine+=30; st.damage.inst+=20;
      AU&&AU.thump(1); st.shake=1.5;
      finish({outcome:'crash', why});
    }
    function landingText(vs){
      const fpm=Math.round(vs*FPM);
      if(vs<1) return `🧈 Yağ gibi! (${fpm} fpm)`; if(vs<2) return `👍 Güzel iniş (${fpm} fpm)`; if(vs<3.2) return `😬 Sert iniş (${fpm} fpm)`; return `💥 Çok sert! (${fpm} fpm)`;
    }
    function finish(r){
      if(st.done) return; st.done=true;
      // aşınma uçuşu
      const res={...r, fuelLeft:Math.max(0,st.fuel), damage:st.damage, tookOff:st.tookOff, vs:st.firstTouchVs||0, distReal:st.distReal};
      st.result=res;
      const titles={landed:'✅ '+D.name+' — iniş başarılı', returned:'↩️ Kalkış yerine geri döndün', forced:'🌾 Zorunlu iniş', crash:'💥 KAZA', aborted:'Uçuş iptal'};
      let body='';
      if(r.outcome==='landed'||r.outcome==='returned') body=`<p style="font-size:18px"><b>${landingText(st.firstTouchVs||0)}</b></p>`;
      if(r.outcome==='forced') body=`<p>Uçak pist dışına indi. ${r.nearDest?'Hedefe yakın olduğun için çekiciyle havalimanına götürülecek.':'Çekiciyle kalkış noktasına geri götürülecek.'}</p>`;
      if(r.outcome==='crash') body=`<p><b>${r.why}</b></p><p>Uçak ağır hasar aldı ve kalkış noktasına çekilecek. Yükün kayboldu.</p>`;
      if(r.outcome!=='aborted' && r.outcome!=='crash' && st.damage.airframe>0) body+=`<p class="muted">Gövde hasarı: -${Math.round(st.damage.airframe)}</p>`;
      if(r.outcome==='aborted'){ cleanup(); resolve(res); return; }
      cardIn.innerHTML=`<h2>${titles[r.outcome]}</h2>${body}<p class="muted">Kalan yakıt: ${Math.round(st.fuel)} L</p><button class="btn primary" style="width:100%" data-done>Devam</button>`;
      setTimeout(()=>card.classList.add('on'), r.outcome==='crash'?900:600);
    }
    function cleanup(){
      cancelAnimationFrame(raf); el.classList.remove('on'); card.classList.remove('on');
      removeEventListener('keydown',kd,true); removeEventListener('keyup',ku,true); removeEventListener('deviceorientation',onOri); el.removeEventListener('wheel',onWheel);
      hc.removeEventListener('pointerdown',pd); hc.removeEventListener('pointermove',pm); hc.removeEventListener('pointerup',pu); hc.removeEventListener('pointercancel',pu);
      AU&&AU.close();
      const lose=gl.getExtension('WEBGL_lose_context'); lose&&lose.loseContext();
    }

    // ---- çizim ----
    let VW=0,VH=0,DPR=1;
    function resize(){ DPR=Math.min(devicePixelRatio||1, coarse?1.5:2); VW=innerWidth; VH=innerHeight; glc.width=VW*DPR; glc.height=VH*DPR; hc.width=VW*DPR; hc.height=VH*DPR; }
    resize(); addEventListener('resize',resize);
    let camDt=0.016;
    function render(){
      gl.viewport(0,0,glc.width,glc.height);
      gl.clearColor(W.fogC[0],W.fogC[1],W.fogC[2],1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
      const Rm=rotM(), up=[Rm[4],Rm[5],Rm[6]], fwd=[-Rm[8],-Rm[9],-Rm[10]];
      let eye,tgt,cup=[0,1,0],near=1.0,fov=62;
      const shk=st.shake*0.4; const sh=[(Math.random()-0.5)*shk,(Math.random()-0.5)*shk,(Math.random()-0.5)*shk];
      if(st.cam==='chase'){
        const k=1-Math.exp(-camDt*3.5);
        st.camHdg = st.camHdg==null ? st.psi : st.camHdg + angDiff(st.psi,st.camHdg)*k;
        st.camPitch = lerp(st.camPitch||0, clamp(st.th,-0.5,0.5)*0.5, k);
        const hf=[Math.sin(st.camHdg),0,-Math.cos(st.camHdg)]; const dist=P.len*1.35+5;
        let cp=vadd(vadd(st.pos,vscl(hf,-dist*Math.cos(st.camPitch))),[0,P.len*0.32+1.6+dist*Math.sin(st.camPitch)*-1,0]);
        const camG=W.heightAt(cp[0],cp[2])+1.5; if(cp[1]<camG) cp[1]=camG;
        eye=vadd(cp,sh); tgt=vadd(vadd(st.pos,vscl(hf,P.len*1.2)),[0,1.2,0]);
      } else {
        const ek = opts.model==='kingair'?[0,1.05,-4.3]:(opts.model==='c172'?[0,0.82,-1.6]:[0,0.78,-1.5]);
        eye=vadd(vadd(st.pos,m4xv(Rm,ek)),sh); const fv=m4xv(Rm,[0,-0.08,-1]); tgt=vadd(eye,fv); cup=up; near=0.3; fov=72;
      }
      const proj=m4persp(fov*D2R,VW/VH,near,30000), view=m4look(eye,tgt,cup), VP=m4mul(proj,view);
      gl.uniformMatrix4fv(R.U.uVP,false,VP); gl.uniform3fv(R.U.uCam,eye); gl.uniform3fv(R.U.uL,vnorm([0.4,0.85,0.3])); gl.uniform3fv(R.U.uFogC,W.fogC); gl.uniform1f(R.U.uFogD,1/11000);
      drawMesh(R,W.sky,m4T(eye[0],eye[1]-200,eye[2]),{em:1,fog:false,noCull:true,noDepth:true});
      drawMesh(R,W.far,null,{});
      if(W.sea) drawMesh(R,W.sea,null,{offset:-1});
      drawMesh(R,W.terrain,null,{});
      drawMesh(R,W.runway,null,{offset:-2});
      drawMesh(R,W.marks,null,{offset:-4,em:0.3});
      drawMesh(R,W.bld,null,{});
      drawMesh(R,W.trees,null,{});
      // rüzgâr tulumu
      for(const ap of [O,D]){ const p=ap.at(250,-ap.wid/2-25,7.6); const wdir=Math.atan2(windV[0],-windV[2]); drawMesh(R,W.sock,m4mul(m4T(p[0],p[1],p[2]),m4mul(m4RY(-wdir),m4RX(-(1-Math.min(1,windSpd/7))*1.2))),{}); }
      // PAPI
      const pc=W.papiPos[0]; const hd=Math.hypot(st.pos[0]-pc[0],st.pos[2]-pc[2]); const ang=Math.atan2(st.pos[1]-P.hg-1,hd)/D2R;
      const thr=[3.5,3.17,2.83,2.5];
      W.papiPos.forEach((p,i)=>{ const white=ang>thr[i]; drawMesh(R,W.papiBox,m4T(p[0],p[1],p[2]),{tint:white?[1,1,1,1]:[1,0.12,0.1,1],em:1,fog:false}); });
      if(FLSET.rings) drawMesh(R,W.rings,null,{em:0.85,noCull:true,alpha:0.75});
      // gölge
      const gh=W.heightAt(st.pos[0],st.pos[2]), onR=onRunway(O,st.pos[0],st.pos[2])||onRunway(D,st.pos[0],st.pos[2]);
      const gY=(onR?0.05:gh)+0.15, agl=st.pos[1]-gY;
      if(agl<300) drawMesh(R,W.shadow,m4mul(m4T(st.pos[0],gY,st.pos[2]),m4mul(m4RY(-st.psi),m4S(PL.span*0.9,1,P.len))),{alpha:0.32*(1-agl/300),offset:-6});
      // uçak
      const M=m4mul(m4T(st.pos[0],st.pos[1],st.pos[2]),Rm);
      if(st.cam==='chase') drawMesh(R,PL.body,M,{});
      for(const pp of PL.props) drawMesh(R,PL.prop,m4mul(M,m4mul(m4T(pp[0],pp[1],pp[2]),m4RZ(st.propA))),{});
      drawMesh(R,W.clouds,null,{em:0.55});
    }

    // ---- HUD ----
    let hintTxt='';
    function setHint(t){ if(t!==hintTxt){ hintTxt=t; document.getElementById('flHint').textContent=t; } }
    let warnKey='';
    function hud(){
      const c=hx; c.setTransform(DPR,0,0,DPR,0,0); c.clearRect(0,0,VW,VH);
      if(st.cam==='cockpit'){
        // basit kokpit çerçevesi: alt panel + cam dikmeleri
        const ph=VH*0.2; const g=c.createLinearGradient(0,VH-ph,0,VH); g.addColorStop(0,'#2b2f35'); g.addColorStop(1,'#1b1e22');
        c.fillStyle=g; c.beginPath(); c.moveTo(0,VH); c.lineTo(0,VH-ph*0.8); c.quadraticCurveTo(VW/2,VH-ph*1.25,VW,VH-ph*0.8); c.lineTo(VW,VH); c.fill();
        c.fillStyle='#3a3f46'; c.beginPath(); c.moveTo(0,0); c.lineTo(VW*0.07,0); c.lineTo(VW*0.02,VH*0.8); c.lineTo(0,VH*0.8); c.fill();
        c.beginPath(); c.moveTo(VW,0); c.lineTo(VW*0.93,0); c.lineTo(VW*0.98,VH*0.8); c.lineTo(VW,VH*0.8); c.fill();
        if(opts.model!=='kingair'){ c.fillStyle='#d9d6cc'; c.fillRect(0,0,VW,VH*0.035); }
      }
      const V=vlen(st.vel), ktV=Math.round(vlen(vsub(st.vel,windV))*KT);
      const gh=W.heightAt(st.pos[0],st.pos[2]);
      const altFt=Math.round((st.altFail?st.altFrozen:st.pos[1]-P.hg)*FT);
      const aglFt=Math.round((st.pos[1]-P.hg-Math.max(0,gh))*FT);
      st.vsDisp=lerp(st.vsDisp,st.vel[1]*FPM,0.1);
      const mid=VW/2, top=Math.max(60, VH*0.08)+ (coarse?0:0);
      // hız kutusu
      const box=(x,y,w,label,val,col)=>{ c.fillStyle='rgba(15,22,30,.72)'; c.strokeStyle='#fff'; c.lineWidth=2; c.beginPath(); c.roundRect?c.roundRect(x,y,w,52,10):c.rect(x,y,w,52); c.fill(); c.stroke();
        c.fillStyle='#bcd'; c.font='bold 11px system-ui'; c.textAlign='left'; c.fillText(label,x+8,y+15); c.fillStyle=col||'#fff'; c.font='bold 24px system-ui'; c.fillText(val,x+8,y+42); };
      const spdCol = st.stallWarn?'#ff5a4f':(ktV>P.vr*KT*0.95?'#fff':'#ffd27a');
      const bx=coarse?12:20, by=coarse?Math.max(70,VH*0.18):Math.max(70,VH*0.3);
      box(bx,by,96,'HIZ (KT)', st.asiFail?'---':String(ktV), st.asiFail?'#ff8a80':spdCol);
      box(VW-bx-110,by,110,'İRTİFA (FT)', String(altFt), st.altFail?'#ff8a80':'#fff');
      c.fillStyle='rgba(15,22,30,.72)'; c.fillRect(VW-bx-110,by+56,110,20); c.fillStyle='#fff'; c.font='bold 12px system-ui'; c.textAlign='left';
      c.fillText((st.vsDisp>=0?'↑ ':'↓ ')+Math.abs(Math.round(st.vsDisp/10)*10)+' fpm',VW-bx-104,by+70);
      c.fillStyle='rgba(15,22,30,.72)'; c.fillRect(bx,by+56,96,20); c.fillStyle='#fff'; c.fillText('AGL '+Math.max(0,aglFt)+' ft',bx+6,by+70);
      // yapay ufuk + pusula
      const ar=coarse?40:56, ax=mid, ay=(VW<560? 118 : top+66);
      c.save(); c.beginPath(); c.arc(ax,ay,ar,0,7); c.clip();
      c.translate(ax,ay); c.rotate(-st.ph); const po=st.th/D2R*ar/30;
      c.fillStyle='#3d8fd6'; c.fillRect(-ar*2,-ar*2+po,ar*4,ar*2); c.fillStyle='#8a5a2b'; c.fillRect(-ar*2,po,ar*4,ar*2);
      c.strokeStyle='#fff'; c.lineWidth=2; c.beginPath(); c.moveTo(-ar*2,po); c.lineTo(ar*2,po); c.stroke();
      c.lineWidth=1; for(const pd of [-20,-10,10,20]){ const yy=po-pd*ar/30; c.beginPath(); c.moveTo(-ar*0.25,yy); c.lineTo(ar*0.25,yy); c.stroke(); }
      c.restore();
      c.strokeStyle='#fff'; c.lineWidth=3; c.beginPath(); c.arc(ax,ay,ar,0,7); c.stroke();
      c.strokeStyle='#ffcc33'; c.lineWidth=4; c.beginPath(); c.moveTo(ax-ar*0.6,ay); c.lineTo(ax-ar*0.18,ay); c.lineTo(ax-ar*0.1,ay+6); c.moveTo(ax+ar*0.6,ay); c.lineTo(ax+ar*0.18,ay); c.lineTo(ax+ar*0.1,ay+6); c.stroke();
      // ILS (yaklaşmada)
      const L=rwyLocal(D,st.pos[0],st.pos[2]); const s=-L.a;
      if(s>200 && s<9000){
        const locDev=clamp(Math.atan2(L.b,s)/D2R/2.5,-1,1); // ±2.5° tam sapma
        const gsDev=clamp((Math.atan2(st.pos[1]-P.hg-15,s)/D2R-3)/0.7,-1,1);
        c.fillStyle='#ff4fd8'; c.beginPath(); c.arc(ax-locDev*ar*0.85,ay+ar-8,5,0,7); c.fill();
        c.beginPath(); c.arc(ax+ar-8,ay+gsDev*ar*0.85,5,0,7); c.fill();
      }
      // pusula
      const hdg=((st.psi/D2R)%360+360)%360;
      const brg=((Math.atan2(D.x-st.pos[0],-(D.z-st.pos[2]))/D2R)%360+360)%360;
      const gate=D.at(-APP_GATE,0); const tgtB = s>APP_GATE+300? ((Math.atan2(gate[0]-st.pos[0],-(gate[2]-st.pos[2]))/D2R)%360+360)%360 : ((D.hdg/D2R - clamp(L.b*0.006,-0.6,0.6)/D2R)%360+360)%360;
      c.fillStyle='rgba(15,22,30,.72)'; const cw=VW<560?148:170; c.fillRect(ax-cw/2,ay+ar+8,cw,40);
      c.fillStyle='#fff'; c.font='bold 14px system-ui'; c.textAlign='center';
      const dd=Math.hypot(D.x-st.pos[0],D.z-st.pos[2]), gR=APP_GATE+700, legK=opts.distKm||100;
      const kmLeft = dd>gR ? gR/1000 + (dd-gR)/(SIM_D-gR)*Math.max(0,legK-gR/1000) : dd/1000;
      c.font=(VW<560?'bold 13px':'bold 14px')+' system-ui'; c.fillText(`YÖN ${String(Math.round(hdg)).padStart(3,'0')}° · ${kmLeft.toFixed(kmLeft<10?1:0)} km`,ax,ay+ar+24);
      const db=angDiff(tgtB*D2R,hdg*D2R)/D2R;
      c.fillStyle= Math.abs(db)<5?'#7dffa0':'#ffcc33'; c.font='bold 13px system-ui';
      c.fillText(Math.abs(db)<5?'▲ Rota doğru':(db>0?'Sağa dön ▶ '+Math.round(db)+'°':'◀ Sola dön '+Math.round(-db)+'°'),ax,ay+ar+41);
      // alt durum satırı
      const fuelPct=st.fuel/st.fuelCap;
      const lines=[`⛽ ${Math.round(st.fuel)} L`, `FLAP ${st.flap}`, `Rüzgâr ${String(Math.round(windFrom/D2R)).padStart(3,'0')}°/${Math.round(windSpd*KT)} kt`];
      c.textAlign='right'; c.font='bold 12px system-ui';
      lines.forEach((t,i)=>{ c.fillStyle='rgba(15,22,30,.6)'; const w=c.measureText(t).width+12; c.fillRect(VW-bx-w,by+82+i*20,w,18); c.fillStyle=(i===0&&fuelPct<0.15)?'#ff8a80':'#fff'; c.fillText(t,VW-bx-6,by+95+i*20); });
      if(st.compress){ c.textAlign='center'; c.fillStyle='rgba(255,204,51,.9)'; c.font='bold 15px system-ui'; c.fillText('⏩ Hızlı seyir ×'+COMPRESS,mid,ay+ar+64); }
      // gaz göstergesi
      flapBtn.textContent='FLAP '+st.flap;
      document.getElementById('flThrFill').style.height=`calc(${st.thr*100}% - ${st.thr*12}px)`;
      document.getElementById('flThrLbl').textContent='GAZ '+Math.round(st.thr*100)+'%';
      // joystick
      if(stick.id!==null){ c.fillStyle='rgba(255,248,236,.18)'; c.strokeStyle='rgba(255,255,255,.7)'; c.lineWidth=3; c.beginPath(); c.arc(stick.ox,stick.oy,70,0,7); c.fill(); c.stroke(); c.fillStyle='rgba(255,248,236,.9)'; c.beginPath(); c.arc(stick.ox+stick.x*70,stick.oy+stick.y*70,26,0,7); c.fill(); }
      else if(coarse && FLSET.ctrl!=='tilt'){ c.strokeStyle='rgba(255,255,255,.4)'; c.lineWidth=2; c.beginPath(); c.arc(VW-110,VH-130,60,0,7); c.stroke(); c.fillStyle='rgba(255,255,255,.55)'; c.font='bold 12px system-ui'; c.textAlign='center'; c.fillText('Kumanda',VW-110,VH-126); }
      // uyarılar
      const W2=[];
      if(st.stallWarn) W2.push(['STALL! Burnu indir',1]);
      if(!st.engineOn) W2.push([st.fuel<=0?'YAKIT YOK':'MOTOR DURDU',1]);
      if(st.rough&&st.engineOn) W2.push(['MOTOR TEKLİYOR',0]);
      if(st.leak) W2.push(['YAKIT KAÇAĞI',0]);
      if(fuelPct<0.12&&st.fuel>0) W2.push(['YAKIT AZ',0]);
      if(!st.onGround && aglFt<250 && st.vsDisp<-1200) W2.push(['PULL UP!',1]);
      for(const m of st.msgs) if(m.until>st.t) W2.push([m.t,0]);
      W2.splice(4);
      const key=W2.map(w=>w[0]).join('|');
      if(key!==warnKey){ warnKey=key; document.getElementById('flWarn').innerHTML=W2.map(w=>`<div class="${w[1]?'':'amber'}">${w[0]}</div>`).join(''); }
      restartBtn.style.display = (!st.engineOn && st.fuel>0 && !st.done) ? 'block':'none';
      // ipucu
      const ktR=Math.round(P.vr*KT);
      let h='';
      if(!st.tookOff){ h = st.thr<0.9 ? 'Gazı tamamen aç' + (coarse?' (soldaki GAZ çubuğu)':' (R tuşu)') : (ktV<ktR ? `Hızlan… ${ktR} kt'da çubuğu kendine çek` : 'Şimdi çubuğu kendine çek ve kalk!'); }
      else if(st.onGround) h='Fren yap ve dur';
      else if(s>APP_GATE && aglFt<500) h='Tırmanmaya devam et (500 ft üstünde hızlı seyir başlar)';
      else if(s>APP_GATE) h = st.compress ? 'Hızlı seyir — rotayı tut' : 'Rotayı takip et';
      else if(s>0) h='Yaklaşma: halkalardan geç, gazı azalt, flap aç, hız ~'+Math.round(P.vr*KT*1.25)+' kt';
      else h='Pistin üzerindesin — burnu hafif kaldır, yumuşak koy';
      setHint(h);
    }

    // ---- döngü ----
    let last=performance.now(), raf=0, acc=0;
    function frame(now){
      const dt=Math.min(0.05,(now-last)/1000); last=now;
      if(!st.paused && !st.done){
        acc+=dt*(st.timeScale||1); const h=1/120; let n=0;
        while(acc>=h && n<480){ step(h); acc-=h; n++; if(st.done) break; }
        if(st.done) acc=0;
      }
      st.shake=Math.max(0,st.shake-dt*1.5)+(st.rough&&st.engineOn?0.05:0);
      const rpmT = st.engineOn ? 0.22+0.78*st.thr : Math.min(0.25,vlen(st.vel)/90);
      st.rpm=lerp(st.rpm,rpmT,0.05); st.propA+= st.rpm*dt*60;
      AU && AU.set(st.paused||st.done?0:st.rpm*(st.rough&&st.engineOn?(0.85+0.15*Math.sin(st.t*9)):1), st.paused?0:vlen(st.vel), st.stallWarn&&!st.paused, st.t);
      camDt=dt; render(); hud();
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
    // test erişimi
    window.__fl={st,O,D,W,P,finish,setAP:f=>st.ap=f};
  });
}

</script>
